.ca-spotlight::before{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(69,101,173,.25),transparent 65%);left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.ca-spotlight-tag{position:absolute;top:16px;left:20px;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;z-index:1}
.ca-spotlight-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--aw-pink);box-shadow:0 0 8px var(--aw-pink);flex-shrink:0}
.ca-spotlight-slot{width:100%;position:relative;z-index:1}

/* ══════════════════════════════════════════════════════════════════════════════════════════
   IL PALCO DEI CONCETTI (deciso con Giulia il 2026-09-23, dopo tre giri di confronto)
   Punto di partenza scelto da lei: il layout normale, NON le varianti a riquadro fisso —
   «questa opzione è l'unica che ha il contenuto che si vede bene». Il riquadro quindi continua
   a crescere col contenuto; quello che cambia è quanto spazio ORIZZONTALE ha il mockup:
   «voglio solo che il riquadro del mockup sia leggermente più lungo, e di fianco il testo, in
   maniera che anche l'interfaccia di TilliT si allunghi e non sia tutto compresso».
   Misurato prima: `.cpanel.active` era `1fr 1fr` — su una finestra da 1915px il palco aveva
   640px e il testo altri 642, sprecati (il testo del concetto è corto). Ora il testo ha una
   larghezza fissa e tutto il resto va al mockup: sulla stessa finestra il palco passa a ~890.
   ⚠️ `.cpanel` vive in `shared-r14.css` e la usano anche OP-01/02/03.html: qui si sovrascrive
   SOLO dentro `#cpanels`, che esiste solo nel guscio. Le pagine vere non cambiano.
   ⚠️ Sotto i 1100px la colonna fissa non lascerebbe niente al palco (misurato in una finestra
   da 799px: al mockup restavano ~10px), quindi sotto quella soglia vince la regola responsive
   che `shared-r14.css` ha già e le due colonne si impilano.
   ══════════════════════════════════════════════════════════════════════════════════════════ */
/* La soglia è 1500 e non è arbitraria: la Station View vuole ~960px per non comprimersi, e
   accanto serve la colonna del testo (380) più le due navigazioni (~410) e i margini (~90).
   Sotto quella larghezza, affiancare vuol dire strozzare il mockup — misurato a 1280: al palco
   restavano 373px, cioè scala 0,53, illeggibile. Quindi sotto i 1500 si IMPILA: il mockup
   prende tutta la larghezza e il testo va sotto. Meno comodo, ma leggibile. */
/* 24/09 (Giulia, revisione OP-03→06 punto D): il testo laterale scorreva via con la pagina — per
   un bersaglio in fondo al mockup (Submit, causali, righe basse) si scendeva e il testo usciva in
   alto. Ora resta FERMO accanto al mockup (sticky). Serviva anche togliere lo scroll annidato di
   `.page-area` (overflow-y:auto in shared-r14.css): pur senza scorrere, un antenato con overflow
   diverso da visible diventa il contenitore dello sticky e lo annulla. Stesso override che OP-01/
   02/03.html hanno già nel loro <style>. `top` = topbar fissa (52px) + respiro; in anteprima
   dall'editor la barra "Preview" aggiunge 40px. Niente overflow/max-height sul pannello: con uno
   scroll interno le ombre e i bordi delle card verrebbero tagliati (trappola dell'anello tagliato);
   il pannello è alto ~400-600px, meno della finestra. */
.page-area{overflow:visible}
@media (min-width:1500px){
  #cpanels .cpanel.active{grid-template-columns:minmax(0,1fr) var(--ls-side-w,380px)}
  #cpanels .cpanel.active > .gc-side{position:sticky;top:68px;align-self:start}
  body.aw-preview-mode #cpanels .cpanel.active > .gc-side{top:108px}
}
@media (max-width:1499px){
  #cpanels .cpanel.active{grid-template-columns:1fr}
}
/* 24/09 (Giulia: "se faccio zoom in il testo va sotto"). Quando il layout normale metterebbe il
   testo sotto (o rimpicciolirebbe il mockup), nei soli Concetti il guscio stringe le due barre di
   sinistra (app a icone, colonna della lezione a una striscia con i soli pallini) e affianca il
   testo, fermo, a 320px — MA solo se al mockup restano >=700px:
   la decisione la prende lsSideFit() misurando, mai rimpicciolendo il mockup. Uscendo dai
   Concetti le barre tornano come erano. Nessuna preferenza salvata viene toccata. */
body.ls-side-fit .aw-spath{width:52px}
body.ls-side-fit.aw-shell,body.ls-side-fit .aw-rail,body.ls-side-fit .aw-spath{transition:none}   /* il palco si misura subito sulla larghezza finale */
body.ls-side-fit .aw-spath-back span,body.ls-side-fit .aw-spath-hd,body.ls-side-fit .aw-spath-title,
body.ls-side-fit .aw-step-lbl,body.ls-side-fit .aw-step-time,body.ls-side-fit .aw-spath-foot,
body.ls-side-fit .aw-spath-reset{display:none}
body.ls-side-fit .aw-spath-back{justify-content:center;padding-left:0;padding-right:0}
body.ls-side-fit #cpanels .cpanel.active{grid-template-columns:minmax(0,1fr) var(--ls-side-w-fit,320px)}
body.ls-side-fit #cpanels .cpanel.active > .gc-side{position:sticky;top:68px;align-self:start}
body.ls-side-fit.aw-preview-mode #cpanels .cpanel.active > .gc-side{top:108px}
/* 24/09 — il testo del concetto in tre pezzi con una gerarchia chiara (revisione, punto D).
   Ordine di lettura invariato — COSA VEDI (la spiegazione, nelle checklist quella del click appena
   fatto) → GOOD TO KNOW (note di sito/configurazione, facoltativo) → FAI QUESTO (il prossimo click)
   → checklist — ma "Fai questo" non e' piu' il riquadro tratteggiato grigio, il meno visibile di
   tutti: e' pieno, rosa tenue, con il testo piu' grande. Solo nel guscio (#cpanels): OP-01/02/03.html
   restano come sono. */
#cpanels .gc-do{background:rgba(224,49,138,.06);border:1.5px solid rgba(224,49,138,.45);border-radius:12px;padding:13px 15px}
#cpanels .gc-do-tag{color:var(--aw-pink);font-size:var(--fs-2xs)}
#cpanels .gc-do-h{font-size:15px;font-weight:var(--fw-b);line-height:1.4}
#cpanels .gc-do-ico{background:var(--aw-pink);color:#fff}
.gc-tip{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
.gc-tip-ico{width:28px;height:28px;border-radius:8px;background:rgba(15,39,87,.07);color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gc-tip-ico svg{width:15px;height:15px}
.gc-tip-tag{font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.gc-tip-d{font-size:12.5px;color:var(--text2);line-height:1.55}
/* Bordi blu notte più stretti, per dare lo spazio al contenuto invece che al contorno, e un
   minimo di altezza perché il riquadro non risulti tozzo quando il mockup è basso. */
#cpanels .ca-spotlight{padding:26px 12px 14px;min-height:560px;justify-content:flex-start;border-radius:12px}
#cpanels .ca-spotlight-tag{top:9px;left:12px}
/* L'intestazione della sezione costava 134px: titolo + due righe di spiegazione generica +
   contatore. La spiegazione la dice già il riquadro «DO THIS NOW» accanto al mockup, passo per
   passo — qui era ridondante, e i px recuperati vanno al palco. */
#page-concepts .pa-sub{display:none}
#page-concepts .pa-banner{margin-bottom:10px}
#page-concepts .cpills{margin-bottom:12px}
body.ls-lay-b.ls-sect-concepts .aw-spath-inner{opacity:0}
/* Radice di un mockup della libreria. `overflow:visible` perché l'anello fucsia dell'engine è un
   box-shadow che sborda dall'elemento su cui è posato. */
.ls-mock{position:relative;overflow:visible}
.next-inline.hidden{display:none}

.quiz-wrap{max-width:none!important;margin:0!important}
#page-quiz .qtxt{max-width:760px}

.ka-locked{display:flex;align-items:center;justify-content:center;min-height:280px}
.ka-locked-inner{text-align:center}
.ka-wrap{max-width:820px;margin:0 auto}
.ka-ticket{display:flex;border-radius:16px;overflow:hidden;box-shadow:var(--e2);margin-bottom:20px;border:.5px solid var(--border)}
.ka-left{background:var(--aw-navy);flex:1.4;padding:28px 28px 22px;display:flex;flex-direction:column;min-width:0}
.ka-left-top{margin-bottom:16px}
.ka-eyebrow{font-size:10px;font-weight:var(--fw-b);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:6px}
.ka-mod-name{font-size:18px;font-weight:var(--fw-b);color:#fff;margin-bottom:4px}
.ka-mod-org{font-size:11px;color:rgba(255,255,255,.4)}
.ka-divider{height:1px;background:rgba(255,255,255,.1);margin-bottom:16px}
.ka-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1}
.ka-field-lbl{font-size:9px;font-weight:var(--fw-b);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:6px}
.ka-field-val{font-size:15px;font-weight:var(--fw-b);color:#fff;line-height:1.2}
.ka-score-val{color:var(--teal)}
.ka-pass-pill{display:inline-block;margin-top:6px;font-size:10px;font-weight:var(--fw-b);color:var(--teal);background:rgba(16,185,129,.15);padding:2px 8px;border-radius:20px}
.ka-field-note{font-size:10px;color:rgba(255,255,255,.32);margin-top:3px}
.ka-left-footer{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.ka-footer-txt{font-size:10px;color:rgba(255,255,255,.3)}
.ka-cert-id{font-size:10px;color:rgba(255,255,255,.3);font-family:monospace}
.ka-sep{width:20px;background:var(--aw-navy);display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.ka-sep-hole{width:20px;height:20px;border-radius:50%;background:var(--bg);flex-shrink:0}
.ka-sep-dashes{flex:1;border-left:2px dashed rgba(255,255,255,.14);margin:4px 0}

.ka-seal-lbl{font-size:10px;font-weight:var(--fw-b);color:#059669;letter-spacing:.08em;text-transform:uppercase}

@media(max-width:720px){

}

/* Completion — le regole `.ka-*` che shared-r14.css NON contiene (vivono inline nel <style> di
   ogni modulo reale). Copiate invariate da OP-03.html così la Completion Card del guscio ha la
   card "prossimo capitolo" e i bottoni con gli stessi pesi e colori della pagina vera. */
.ka-lock-icon{margin-bottom:14px;color:var(--text3);display:flex;justify-content:center}
.ka-lock-icon svg{width:38px;height:38px}
.ka-lock-h{font-size:15px;font-weight:var(--fw-sb);color:var(--text);margin-bottom:8px}
.ka-lock-sub{font-size:13px;color:var(--text2)}
.ka-btn-print,.ka-btn-next,.ka-btn-review{font-size:13px;padding:9px 20px;border:none;border-radius:var(--rsm);cursor:pointer;font-family:var(--font);font-weight:var(--fw-sb)}
.ka-btn-print{background:var(--aw-navy);color:#fff}
.ka-btn-next{background:var(--aw-pink);color:#fff}
.ka-btn-review{background:var(--bg2);color:var(--text);border:.5px solid var(--border)}
.ka-next-card{background:var(--bg);border:.5px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ka-next-eyebrow{font-size:10px;font-weight:var(--fw-b);color:var(--aw-blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.ka-next-name{font-size:14px;font-weight:var(--fw-sb);color:var(--text);margin-bottom:3px}
.ka-next-sub{font-size:12px;color:var(--text2)}
.ka-next-btn{font-size:13px;padding:8px 20px;background:var(--aw-navy);color:#fff;border:none;border-radius:var(--rsm);cursor:pointer;font-family:var(--font);font-weight:var(--fw-med);white-space:nowrap}
.ka-next-btn:hover{background:var(--aw-blue)}

/* Practice a esercizi — le regole `.pa-*` e `.sec-proceed` che shared-r14.css non contiene
   (vivono inline in ogni modulo reale). Copiate invariate da OP-03.html: sono la struttura a due
   drill affiancati con il misuratore di avanzamento, il pezzo che rendeva la Practice del guscio
   riconoscibilmente diversa da quella dei moduli veri. I componenti della chat dello scenario
   (.msgs .m .mav .mbubble .tdots .verdict-* .qb .qbtns) sono invece GIÀ in shared-r14.css. */
.pa-banner{background:var(--bg);margin:0 0 14px;padding:12px 20px;border-radius:14px;border:.5px solid var(--border);box-shadow:var(--e3);min-height:106px;box-sizing:border-box;position:relative;overflow:hidden}
.pa-banner::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--aw-pink)}
.pa-banner-in{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
/* 25/09 (Giulia, INVENTARIO_CONTENT_EDITOR §2.2): UNA sola intestazione di sezione. Prima solo la
   Practice aveva il titolo nel riquadro bianco; Video, Key Concepts e Quiz avevano un .sec-head
   senza nessuna regola CSS, cioe una riga nuda sul fondo grigio. Ora usano tutte lo stesso
   .pa-banner; la variante .ls-sh non ha il min-height, che serve solo al misuratore della Practice. */
.pa-banner.ls-sh{min-height:0}
.pa-banner.ls-sh .pa-banner-in{align-items:center}
.ls-sh-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pa-banner-l{flex:1;min-width:0}
.pa-title{font-size:var(--fs-h1);font-weight:var(--fw-sb);color:var(--text);margin:0 0 5px;line-height:var(--lh-tight)}
.pa-sub{font-size:13px;color:var(--text2);line-height:var(--lh-body);max-width:500px}
.pa-meter-box{display:flex;flex-direction:column;gap:8px;align-items:flex-end;padding-top:6px;flex-shrink:0}
.pa-meter-lbl{font-size:24px;font-weight:var(--fw-b);color:var(--text);line-height:1;letter-spacing:-1px}
.pa-track{width:180px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pa-fill{height:100%;background:var(--aw-pink);border-radius:3px;width:0%;transition:width .4s ease}
.pa-steps-row{display:flex;justify-content:space-between;width:180px}
.pa-step-lbl{font-size:10px;color:var(--text3);font-weight:var(--fw-sb);letter-spacing:.04em;transition:color .3s}
.pa-step-lbl.done{color:var(--aw-pink)}
/* 24/09 notte (revisione corso, B2): gli esercizi stanno UNO SOTTO L ALTRO, ognuno largo come la
   Practice a esercizio unico. Affiancati, il mockup di "Find it on screen" finiva in mezza colonna
   (scala 0,55: il globo di OP-01.1 misurava 9x12 px). */
.pa-drills{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
@media(max-width:720px){.pa-drills{grid-template-columns:1fr}}
.pa-drill{background:var(--bg);border:.5px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,box-shadow .25s}
.pa-drill.is-done{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.pa-drill-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg2);border-bottom:.5px solid var(--border);flex-shrink:0}
.pa-drill-num{font-size:28px;font-weight:800;color:var(--aw-blue);opacity:.22;line-height:1;flex-shrink:0;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.pa-drill-info{flex:1;min-width:0}
.pa-drill-t{font-size:14px;font-weight:var(--fw-b);color:var(--text)}
.pa-drill-sub{font-size:11px;color:var(--text3);margin-top:2px}
.pa-drill-check{font-size:13px;font-weight:var(--fw-b);color:var(--teal);flex-shrink:0;width:18px;text-align:center}
.pa-drill-body{padding:18px 20px;flex:1}
.pa-drill-placeholder{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:52px 20px;gap:12px;flex:1}
/* L'SVG del lucchetto non porta width/height proprie (svgLockIco() è condivisa con la Completion,
   dove le dimensioni le dà `.ka-lock-icon svg`): senza questa regola il riquadro bloccato mostra
   solo il testo. */
.pa-lock-icon{opacity:.3;color:var(--text3);display:flex}
.pa-lock-icon svg{width:30px;height:30px}
.pa-lock-msg{font-size:12px;color:var(--text3);text-align:center;max-width:160px;line-height:1.5}
/* Riordino (drag & drop). Nei moduli reali queste sono ~15 righe di `style=""` inline ripetute su
   ogni riga e su ogni slot: qui sono classi, stessi valori. */
.seq-source{display:flex;flex-direction:column;gap:8px;margin:14px 0 20px}
.seq-zones{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.drag-item{padding:11px 16px;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--rsm);cursor:grab;font-size:13px;color:var(--text);display:flex;align-items:center;gap:10px;user-select:none;transition:opacity .15s}
.seq-grip{font-size:16px;color:var(--text3);flex-shrink:0}
.drop-zone{padding:11px 16px;border:2px dashed var(--border2);border-radius:var(--rsm);min-height:44px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:10px;transition:background .15s,border-color .15s}
.drop-zone.over{background:var(--purple-l);border-color:var(--purple)}
.drop-zone .drag-item{flex:1;margin:0;border-style:solid}
.seq-num{width:22px;height:22px;border-radius:50%;background:var(--purple-l);color:var(--purple-d);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sec-proceed{display:none;align-items:center;justify-content:center;gap:16px;margin-top:22px;padding-top:20px;border-top:.5px solid var(--border)}
.sec-proceed.show{display:flex}
.sec-proceed-lbl{font-size:15px;font-weight:var(--fw-sb);color:var(--text)}
/* Il palco del mockup dentro un drill: nei moduli reali il mockup della click-simulation è
   disegnato direttamente nel corpo dell'esercizio, non su un palco scuro a tutta larghezza. */
#pex-1 .ca-spotlight{min-height:0;padding:14px;border-radius:10px}
/* 03/10 (fiera) — il bottone tondo "continua" a fine sezione: in OP-03.html la regola sta nel <style> della pagina,
   qui mancava e il bottone misurava 3 px (si vedeva solo la scritta). Per ora solo in Practice. */
#page-practice .next-inline{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--aw-pink);border:none;cursor:pointer;flex-shrink:0;color:#fff;box-shadow:0 6px 18px rgba(224,49,138,.4);transition:transform .15s,box-shadow .2s}

/* Stampa del certificato — stessa regola dei moduli reali, con `#page-completion` al posto di

body.ls26 .aw-mod-layout{display:block;min-height:0}
body.ls26 .aw-mod-main{display:flex;flex-direction:column;height:calc(100vh - 52px);min-height:560px}
body.ls26.aw-preview-mode .aw-mod-main{height:calc(100vh - 92px)}
/* Misure al 90% (Giulia 06/10: "a 90% lo trovo più armonioso"): caratteri, spazi e altezze della
   cornice ridotti di un decimo; la colonna passa da 400 a 360 px. */
/* testata */
.ls26-head{display:flex;align-items:center;gap:18px;padding:9px 25px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.ls26-hd-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ls26-crumb{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.ls26-crumb a{color:var(--text2);text-decoration:none}.ls26-crumb a:hover{color:var(--aw-pink)}
.ls26-crumb svg{width:13px;height:13px;opacity:.6}
.ls26-h1{margin:0;font-size:18px;font-weight:var(--fw-b);letter-spacing:-.02em;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls26-pills{display:flex;gap:5px;flex-wrap:wrap;margin-right:8px}
.ls26-pill{height:27px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);font-family:var(--font);font-size:11px;font-weight:var(--fw-b);color:var(--text3);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.ls26-pill .n{font-variant-numeric:tabular-nums}
.ls26-pill svg{width:12px;height:12px}
.ls26-pill.done{color:var(--teal-d);background:var(--teal-l);border-color:var(--teal)}
.ls26-pill.cur{color:var(--aw-pink);background:rgba(224,49,138,.08);border-color:var(--aw-pink)}
.ls26-pill.locked{cursor:not-allowed;opacity:.7}
.ls26-hd-r{display:flex;align-items:center;gap:7px;flex-shrink:0}
/* percorso al centro della testata (10/10): titolo | percorso | durata, Notes, Tutor */
.ls26-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.ls26-head .ls26-hd-r{justify-self:end}
.ls26-steps{display:flex;align-items:flex-start;padding:2px 0}
.ls26-st{display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;padding:0;border:0;background:none;font-family:var(--font);cursor:pointer;color:var(--text3)}
.ls26-st .c{width:28px;height:28px;border-radius:50%;border:2px dashed var(--border2,#c5cbd8);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:var(--fw-b);font-variant-numeric:tabular-nums;transition:transform .2s,background .2s}
.ls26-st .c svg{width:13px;height:13px}
.ls26-st .l{font-size:12px;font-weight:var(--fw-sb);line-height:1.1;white-space:nowrap}
.ls26-st:hover:not(.locked) .c{border-color:var(--aw-navy)}
.ls26-st.done{color:var(--text2)}
.ls26-st.done .c{border:2px solid var(--teal);background:var(--teal);color:#fff}
.ls26-st.cur{color:var(--aw-pink)}
.ls26-st.cur .c{border:2px solid var(--aw-pink);background:var(--aw-pink);color:#fff;transform:scale(1.18);box-shadow:0 0 0 5px rgba(224,49,138,.15)}
.ls26-st.cur .l{font-weight:800}
.ls26-st.locked{cursor:not-allowed}
.ls26-cn{width:50px;height:0;margin:14px -23px 0;border-top:2px dashed var(--border2,#c5cbd8);flex-shrink:0}
.ls26-cn.done{border-top-style:solid;border-color:var(--teal)}
.ls26-st:active .c{transform:translateY(1px)}
.ls26-st.cur:active .c{transform:scale(1.18) translateY(1px)}
.ls26-st:focus-visible{outline:none}.ls26-st:focus-visible .c{outline:3px solid var(--aw-active-lilac,#b9a7ff);outline-offset:2px}
.ls26-dur{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:var(--fw-sb);color:var(--text2);margin-right:5px}
.ls26-dur svg,.ls26-tbtn svg{width:15px;height:15px}
.ls26-tbtn{position:relative;height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--border2,var(--border));background:var(--bg);color:var(--text);font-family:var(--font);font-size:12px;font-weight:var(--fw-b);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ls26-tbtn:hover{border-color:var(--aw-navy)}
.ls26-tbtn.icon{width:32px;padding:0;justify-content:center}
.ls26-tbtn .ls26-badge{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--aw-pink);color:#fff;font-size:10px;line-height:16px;text-align:center}
/* corpo: palco + colonna */
.ls26-body{flex:1;min-height:0;display:flex}
body.ls26 .page-area{flex:1;min-width:0;overflow-y:auto}
body.ls26 .page{padding:20px 25px}
.ls26-rail{width:360px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.ls26-rail-gen{display:flex;flex-direction:column;gap:18px;flex:1}
.ls26-gcs{display:none!important}
.ls26-gcs.on{display:flex!important}
/* i pezzi del testo dei concetti, che prima vivevano sotto #cpanels */
.ls26-rail .gc-do{background:rgba(224,49,138,.06);border:1.5px solid rgba(224,49,138,.45);border-radius:11px;padding:12px 13px}
.ls26-rail .gc-do-tag{color:var(--aw-pink);font-size:var(--fs-2xs)}
.ls26-rail .gc-do-h{font-size:14px;font-weight:var(--fw-b);line-height:1.4}
.ls26-rail .gc-do-ico{background:var(--aw-pink);color:#fff}
body.ls26 #page-concepts > .pa-banner,body.ls26 #cpills{display:none}
body.ls26 #cpanels .cpanel.active{grid-template-columns:1fr}
/* pezzi della colonna */
.ls26-rh{display:flex;align-items:center;gap:9px}
.ls26-rh .tile{width:27px;height:27px;border-radius:7px;background:var(--aw-navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ls26-rh .tile svg{width:15px;height:15px}
.ls26-rh .t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.ls26-rh .rule{flex:1;height:2px;border-radius:1px;background:var(--border);margin-left:4px}
.ls26-rsec{display:flex;flex-direction:column;gap:10px}
.ls26-tlist{display:flex;flex-direction:column;gap:2px;padding-left:36px}
.ls26-tl{display:flex;align-items:center;gap:9px;min-height:32px;font-size:13px;font-weight:600;color:var(--text3)}
.ls26-tl .b{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2,var(--border));display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.ls26-tl .b svg{width:11px;height:11px}
.ls26-tl .m{margin-left:auto;font-size:11px;color:var(--text3);font-weight:500}
.ls26-tl.done{color:var(--text)}.ls26-tl.done .b{background:var(--teal);border-color:var(--teal);color:#fff}
.ls26-tl.cur{color:var(--aw-pink);font-weight:800}.ls26-tl.cur .b{border-color:var(--aw-pink);color:var(--aw-pink)}
.ls26-tl.grp{min-height:24px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.ls26-tl.grp + .ls26-sub{margin-left:0}
.ls26-term{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-left:36px}
.ls26-term b{font-size:13px;color:var(--text)}.ls26-term p{margin:3px 0 0;font-size:12px;color:var(--text2);line-height:1.45}
.ls26-why{margin-top:auto;background:var(--bg3,var(--bg));border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px}
.ls26-why b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.ls26-why p{margin:0;font-size:13px;line-height:1.5;color:var(--text)}
/* barra in basso */
.ls26-bar{height:64px;flex-shrink:0;border-top:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:13px;padding:0 25px}
.ls26-bar .sp{flex:1}
.ls26-cnt{font-size:13px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.ls26-back{height:40px;padding:0 14px;border-radius:7px;border:1px solid var(--border2,var(--border));background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;font-weight:var(--fw-b);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.ls26-back:hover{border-color:var(--aw-navy)}
.ls26-main{height:43px;padding:0 18px;border-radius:7px;border:0;background:var(--aw-pink);color:#fff;font-family:var(--font);font-size:14px;font-weight:var(--fw-b);display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.ls26-main:hover{filter:brightness(.92)}
.ls26-main[disabled]{background:var(--bg3,var(--border));color:var(--text3);cursor:not-allowed;filter:none}
.ls26-back svg,.ls26-main svg{width:16px;height:16px;flex-shrink:0}
.ls26-back:active,.ls26-main:not([disabled]):active,.ls26-tbtn:active,.ls26-pill:active{transform:translateY(1px)}
body.ls26 button:focus-visible{outline:3px solid var(--aw-active-lilac,#b9a7ff);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .ls26-main.pulse{animation:ls26pulse 1.2s ease-out 1}
  @keyframes ls26pulse{0%{box-shadow:0 0 0 0 rgba(224,49,138,.6)}100%{box-shadow:0 0 0 14px rgba(224,49,138,0)}}
}
/* toast "sezione bloccata": navy con pallino rosa */
.ls26-toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:3000;background:var(--aw-navy);color:#fff;padding:11px 16px 11px 31px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 8px 22px rgba(19,32,74,.25);max-width:calc(100% - 32px)}
.ls26-toast::before{content:'';position:absolute;left:14px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--aw-pink);box-shadow:0 0 8px var(--aw-pink)}
/* Intro (06/10 sera, Giulia: "un mix"): riquadro navy a due colonne — testo a sinistra, COPERTINA del
   capitolo a destra (intro.cover, la cornice-dispositivo di sempre); sotto, "What you will do" scritto
   nell'editor. Senza copertina il riquadro torna a una colonna. */
.ls26-stage{display:flex;flex-direction:column;gap:14px;min-height:100%}
/* "La card di inizio deve attirare l'attenzione" (Giulia 06/10): alone rosa e blu sul navy, titolo più
   grande con l'accento rosa, dati in pillole, copertina sollevata e leggermente in prospettiva, entrata
   morbida (solo se l'utente non ha chiesto meno movimento). */
.ls26-hero{position:relative;overflow:hidden;border-radius:14px;color:#fff;padding:30px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center;flex:1;
  background:radial-gradient(circle at 88% 12%,rgba(224,49,138,.38),transparent 42%),radial-gradient(circle at 6% 104%,rgba(91,134,229,.30),transparent 48%),linear-gradient(120deg,#13204A,#1B2D6B);
  box-shadow:0 14px 34px rgba(19,32,74,.28)}
.ls26-hero::after{content:'';position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.ls26-accent{display:block;width:48px;height:4px;border-radius:2px;background:var(--aw-pink);margin-top:-2px}
.ls26-hero .meta span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 11px}
/* 10/10 (Giulia): copertina dritta (niente prospettiva) e centrata nella sua metà del riquadro */
.ls26-hero.has-cover .iv-visual{display:flex;align-items:center;justify-content:center;align-self:stretch}
.ls26-hero.has-cover .iv-dev{width:100%;max-width:620px;margin:0 auto}
/* riga d'identità in cima al riquadro: prodotto + training */
.ls26-brand{display:flex;flex-direction:column;gap:3px;padding-bottom:14px;margin-bottom:2px;border-bottom:1px solid rgba(255,255,255,.12)}
.ls26-brand .p{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9FB0DE}
.ls26-brand .tr{font-size:19px;font-weight:var(--fw-b);color:#fff;letter-spacing:-.01em}
@media (prefers-reduced-motion:no-preference){
  .ls26-hero-tx{animation:ls26up .5s ease-out both}
  .ls26-hero .iv-visual{animation:ls26in .7s .1s ease-out both}
  @keyframes ls26up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes ls26in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
}
/* colonna: la mappa "Your path" con i sotto-punti, e in fondo contesto + Tutor */
.ls26-sub{display:flex;flex-direction:column;gap:1px;margin:-2px 0 6px 29px;padding-left:12px;border-left:2px solid var(--border)}
.ls26-subi{display:flex;align-items:center;gap:8px;min-height:24px;font-size:12px;color:var(--text2);line-height:1.35}
.ls26-subi i{width:6px;height:6px;border-radius:50%;background:var(--border2,var(--border));flex-shrink:0;margin:0 3px}
.ls26-subi svg{width:12px;height:12px;color:var(--teal);flex-shrink:0}
.ls26-subi.ok{color:var(--text)}
.ls26-subi.on{color:var(--aw-pink);font-weight:700}
.ls26-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.ls26-foot .ls26-why{margin-top:0}
.ls26-ask{display:flex;align-items:center;gap:9px;width:100%;height:40px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;font-weight:var(--fw-b);cursor:pointer;text-align:left}
.ls26-ask span{flex:1}.ls26-ask svg{width:15px;height:15px;color:var(--aw-pink)}
.ls26-ask:hover{border-color:var(--aw-pink)}
.ls26-hero.has-cover{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.ls26-hero-tx{display:flex;flex-direction:column;gap:12px;min-width:0;max-width:560px}
.ls26-hero .ls-pilot-badge{align-self:flex-start;margin-left:0}
.ls26-hero .eb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#FF8DB5}
.ls26-hero h2{margin:0;font-size:32px;line-height:1.15;color:#fff;letter-spacing:-.02em;font-weight:var(--fw-b)}
.ls26-hero p{margin:0;color:#C9D0EA;font-size:14px;line-height:1.55}
.ls26-hero ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ls26-hero ol li{display:flex;gap:9px;font-size:13px;color:#fff;line-height:1.4}
.ls26-hero ol li span{flex-shrink:0;width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.12);font-size:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ls26-hero .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#C9D0EA;font-weight:600}
.ls26-hero .meta span{display:inline-flex;align-items:center;gap:6px}
.ls26-hero .meta svg{width:15px;height:15px}
.ls26-hero .iv-visual{min-width:0}
.ls26-hero .iv-dev{box-shadow:0 14px 34px rgba(0,0,0,.35)}
.ls26-hero .ls-cover-img{border-radius:8px}
.ls26-wyd-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:-4px}
.ls26-row3{display:grid;grid-template-columns:repeat(var(--ls26-n,3),minmax(0,1fr));gap:12px}
.ls26-wcard{border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start;background:var(--bg)}
.ls26-wcard .ic{width:38px;height:38px;border-radius:9px;background:var(--bg2);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.ls26-wcard .ic svg{width:18px;height:18px}
.ls26-wcard b{display:block;font-size:14px;margin-bottom:3px;color:var(--text)}
.ls26-wcard span{font-size:12px;color:var(--text2);line-height:1.4}
.ls26-wcard.step span{font-size:13px;color:var(--text);line-height:1.45}
/* ── Concepts 2026 (blocco 2): palco, messaggi, colonna ── */
.ls26-body{position:relative}
/* 07/10: niente etichetta "SPOTLIGHT · CONCEPT n" e bordo navy stretto → altezza alla schermata
   (il conto dello spazio sta in LS26_STAGE_PAD, ls26View). */
body.ls26 #page-concepts{padding-top:12px;padding-bottom:12px}
body.ls26 #cpanels .ca-spotlight{min-height:0;padding:10px}
body.ls26 #cpanels .ca-spotlight-tag{display:none}
body.ls26 #cpanels .ca-spotlight .gc-path{display:none}
body.ls26 .gc-target.pulse{animation-iteration-count:2}
body.ls26 .l26-noguide .gc-dim{opacity:1 !important;filter:none !important}
/* 07/10 notte (COPIONE_CAP1-2_v6 §0): una zona dentro una zona già attenuata non si attenua due volte */
body.ls26 .gc-dim .gc-dim{opacity:1;filter:none}
body.ls26 .l26-noguide .gc-target{box-shadow:none !important;outline:none !important;animation:none !important}
/* il messaggio verde (fatto) o ambra (errore): 07/10 (Giulia, da BigScreen_prototype) sta nel bordo navy
   del simulatore, SOTTO la schermata: attaccato a dove si guarda, non copre niente. Senza messaggio, lo
   stesso posto dice il passo in corso ("Now: …"); a destra sempre "Step k of m". */
.ls26-vfoot{width:100%;height:28px;margin-top:6px;display:flex;align-items:center;gap:12px;position:relative;z-index:1;color:#C9D0EA;font-size:13px;font-weight:700}
.ls26-vf-main{flex:1;min-width:0;display:flex;align-items:center}
.ls26-vf-now{display:flex;align-items:center;gap:8px;padding-left:4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls26-vf-now::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--aw-pink);box-shadow:0 0 8px var(--aw-pink);flex-shrink:0}
.ls26-vf-now.clear::before{background:#3CCB7F;box-shadow:0 0 8px #3CCB7F}
.ls26-vf-step{flex-shrink:0;font-size:12px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.55);padding-right:4px}
.ls26-vfoot.has-msg .ls26-vf-now{display:none}
.ls26-msg{display:none;align-items:center;gap:10px;min-width:0;max-width:100%;max-height:44px;overflow:hidden;border-radius:8px;padding:5px 12px;font-size:13px;line-height:1.3}
.ls26-msg.on{display:flex}
.ls26-msg .ic{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ls26-msg .ic svg{width:13px;height:13px}
/* frase e "dove guardare" di seguito, così anche i messaggi più lunghi stanno in 2 righe */
.ls26-msg b{font-weight:700}
.ls26-msg small{font-size:12px;font-weight:500;margin-left:4px;opacity:.9}
.ls26-msg.ok{background:#E9F6EF;color:#0F4D2C;border:1px solid #B5DEC6}.ls26-msg.ok .ic{background:#2E9E62;color:#fff}
.ls26-msg.warn{background:#FFF3DC;color:#8A5A00;border:1px solid #EBCB83}.ls26-msg.warn .ic{background:#E3A21A;color:#fff}
@media (prefers-reduced-motion:no-preference){
  .ls26-msg.ok.on{animation:ls26flashok .7s ease-out}
  .ls26-msg.warn.on{animation:ls26flashwarn .7s ease-out}
  @keyframes ls26flashok{from{box-shadow:0 0 0 0 rgba(46,158,98,.55)}to{box-shadow:0 0 0 10px rgba(46,158,98,0)}}
  @keyframes ls26flashwarn{from{box-shadow:0 0 0 0 rgba(227,162,26,.6)}to{box-shadow:0 0 0 10px rgba(227,162,26,0)}}
  .ls26-shake{animation:ls26shake .4s}
  @keyframes ls26shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
}
.ls26-okflash{outline:3px solid #3CCB7F!important;outline-offset:2px}
.ls26-shake{outline:3px solid #F2B33D!important;outline-offset:2px}
/* colonna del concetto: i pezzi del motore che il copione sostituisce si nascondono */
.ls26-gcs.l26 .gc-steps,.ls26-gcs.l26 .gc-review,.ls26-gcs.l26 .gc-ctx,.ls26-gcs.l26 .gc-check,.ls26-gcs.l26 .gc-done,.ls26-gcs.l26 .gc-next{display:none!important}
.ls26-gcs.fin .l26-extra .l26-chips,.ls26-gcs.fin .l26-extra .l26-why{display:none}
.l26-kc{display:flex;flex-direction:column;gap:6px}
.l26-no{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--aw-pink);display:inline-flex;align-items:center;gap:6px}
.l26-no svg{width:13px;height:13px}
.l26-no.clear{color:var(--teal-d)}
.l26-kc h2{margin:0;font-size:20px;line-height:1.25;color:var(--text);font-weight:var(--fw-b)}
.l26-kc p{margin:0;font-size:13px;line-height:1.55;color:var(--text2)}
.l26-extra{display:flex;flex-direction:column;gap:14px}
.l26-chips{display:flex;flex-direction:column;gap:6px}
.l26-chips div{display:flex;gap:8px;align-items:flex-start;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;line-height:1.4}
.l26-chips svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.l26-chips .do{background:#E9F6EF;color:#0F4D2C}.l26-chips .dont{background:#FFF3DC;color:#8A5A00}
.l26-why{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.l26-why b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.l26-why p{margin:0;font-size:12.5px;line-height:1.5;color:var(--text2)}
.l26-list .ls26-tl{min-height:30px}
.l26-recap{margin:-4px 0 4px 29px;font-size:12px;color:var(--text2);line-height:1.4}
.l26-key{margin-top:auto;background:var(--teal-l);border:1px solid var(--teal);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.l26-key b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-d)}
.l26-key p{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--text)}
.ls26-link{border:0;background:none;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:var(--fw-b);display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:6px}
.ls26-link svg{width:15px;height:15px}.ls26-link:hover{color:var(--aw-pink)}
/* fine dei Concepts (§2.5) */
.ls26-gcs.allend > *:not(.l26-end){display:none!important}
.l26-end{display:flex;flex-direction:column;gap:12px}
.l26-end h2{margin:0;font-size:20px;line-height:1.25;color:var(--text)}
.l26-end p{margin:0;font-size:13px;line-height:1.55;color:var(--text2)}
.l26-bigok{width:50px;height:50px;border-radius:50%;background:#E9F6EF;color:#2E9E62;display:flex;align-items:center;justify-content:center}
.l26-bigok svg{width:26px;height:26px}
.l26-chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px;color:var(--text3)}
.l26-chain span{height:28px;padding:0 9px;border-radius:7px;background:var(--aw-navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;display:inline-flex;align-items:center}
.l26-chain span.last{background:#2E9E62}
/* ── Colonna a 3 piani fissi (07/10, Giulia; mockup _scratch/MOCKUP_COLONNA_CONCEPTS_2026-10-07.html) ──
   ① il concetto (.l26-kc) · ② la carta del passo, l'unico posto da leggere mentre si clicca (rosa = cosa
   fare, verde = cosa è successo + Good to know + Next, ambra = l'errore sotto l'istruzione) · elenco
   compatto dei passi · ③ Why/chip, che a concetto finito diventano il Key message NELLO STESSO posto e
   con la stessa altezza. Cambia il contenuto, mai la posizione. I pezzi di prima restano nel DOM, nascosti. */
body.ls26 #ls26-rail-cc{flex:1;min-height:0;display:flex;flex-direction:column}
.ls26-gcs.l26v2{flex:1;min-height:0;flex-direction:column;gap:14px}
.ls26-gcs.l26v2 > *:not(.l26-kc):not(.l26c):not(.l26-end){display:none!important}
.ls26-gcs.l26v2 > .l26-end{display:none!important}
.ls26-gcs.l26v2.allend > .l26-kc,.ls26-gcs.l26v2.allend > .l26c{display:flex!important}
.ls26-gcs.l26v2 .l26-kc p{font-size:12.5px;line-height:1.5}
.ls26-gcs.l26v2 .l26-f3 .l26-why p{font-size:12px;line-height:1.45}
.l26c{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.l26-card{flex:1;min-height:150px;border-radius:12px;border:2px solid var(--aw-pink);background:var(--bg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.l26-card .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--aw-pink);display:flex;align-items:center;gap:8px}
.l26-card .tag i{width:22px;height:22px;border-radius:50%;background:var(--aw-pink);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.l26-card .tag i svg{width:12px;height:12px}
.l26-card .do{font-size:16px;font-weight:600;line-height:1.4;color:var(--text)}
.l26-card .res{font-size:15px;font-weight:500;line-height:1.5;color:#0F4D2C}
.l26-card .gtk{background:var(--bg2);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.45;color:var(--text2)}
.l26-card .gtk b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin-bottom:2px}
.l26-card .err{border-radius:8px;background:#FFF3DC;border:1px solid #EBCB83;color:#8A5A00;padding:9px 11px;font-size:14px;line-height:1.45;font-weight:600}
.l26-card .err small{display:block;font-size:13px;font-weight:500;margin-top:4px}
/* 06/10 (COPIONE_CAP1 §10): righe da provare nella carta del passo (`swatches`, come OP-02 concetto 2) */
.l26-card .sws{display:flex;flex-direction:column;gap:6px}
.l26-card .sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:inherit;color:var(--text)}
.l26-card .sw:hover{border-color:var(--text2)}
.l26-card .sw.on{box-shadow:inset 0 0 0 2px var(--text)}
.l26-card .sw i{flex:0 0 auto;width:16px;height:16px;border-radius:4px}
.l26-card .sw span{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.35}
.l26-card .sw span b{display:block;font-size:13px;font-weight:600}
.l26-card .sw span small{display:block;font-size:12px;color:var(--text2)}
.l26-card .sw em{flex:0 0 auto;font-style:normal;color:var(--text2);width:14px;height:14px}
.l26-card .sw em svg{width:14px;height:14px}
.l26-card .hint{margin-top:auto;font-size:12px;color:var(--text3)}
.l26-card .l26-next{margin-top:auto;position:sticky;bottom:0;flex-shrink:0;box-shadow:0 -6px 12px rgba(233,246,239,.9);min-height:42px;border-radius:9px;border:0;background:var(--aw-pink);color:#fff;font-family:var(--font);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;cursor:pointer;text-align:center}
.l26-card .l26-next svg{width:16px;height:16px;flex-shrink:0}
.l26-card .l26-next:active{transform:translateY(1px)}
.l26-card .l26-next.sec{background:var(--bg);color:var(--text);border:1px solid var(--border2,var(--border))}
.l26-card.ok{border-color:#2E9E62;background:#E9F6EF}.l26-card.ok .tag{color:#0F4D2C}.l26-card.ok .tag i{background:#2E9E62}
.l26-card.ok .gtk{background:rgba(255,255,255,.7)}
/* 16/10 sera: nel tema scuro il bianco al 70% rendeva illeggibile il "Good to know" (testo chiaro su fondo chiaro) */
[data-theme="dark"] .l26-card.ok .gtk{background:rgba(255,255,255,.06)}
.l26-card.wa{border-color:#E3A21A}
/* fine dei Concepts (§2.5) dentro la carta dell'ultimo concetto, non più al posto della colonna */
.l26-card .l26-chain{margin-top:2px}
.l26-card .endh{font-size:16px;font-weight:700;line-height:1.3;color:var(--text)}
.l26-card .endp{font-size:13px;line-height:1.5;color:var(--text2)}
@media (prefers-reduced-motion:no-preference){.l26-card.flash{animation:l26cardin .35s ease-out}@keyframes l26cardin{from{transform:scale(.985);opacity:.6}to{transform:none;opacity:1}}}
/* 07/10 (ANALISI_CHECKLIST_AREE §3): checklist d'area — le voci nella carta, le voci da fare tratteggiate sullo schermo */
.l26-card .vis{display:flex;flex-direction:column;gap:3px}
.l26-card .ado{font-size:14px;font-weight:500;color:var(--text2)}
.l26-card .vi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-family:inherit;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer}
.l26-card .vi:hover{background:var(--bg2)}
.l26-card .vi .b{width:20px;height:20px;border-radius:50%;border:2px dashed var(--aw-pink);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.l26-card .vi .b svg{width:11px;height:11px}
.l26-card .vi.done{color:var(--text)}
.l26-card .vi.done .b{background:#2E9E62;border:2px solid #2E9E62}
.l26-card .vi.open{border-color:var(--aw-pink);background:var(--bg2);color:var(--text)}
.l26-card.ok .vi.open{border-color:#2E9E62;background:rgba(255,255,255,.7)}
.l26-card .vx{margin:2px 0 6px 37px;display:flex;flex-direction:column;gap:8px}
.l26-card .vx .res,.l26-card .vx .do{font-size:14px;line-height:1.5}
body.ls26 .l26-multi .l26-todo{outline:2px dashed var(--aw-pink);outline-offset:-3px;border-radius:6px;cursor:pointer}
body.ls26 .l26-multi .l26-vopen{outline:2px solid var(--aw-pink);outline-offset:-3px;border-radius:6px}
body.ls26 .l26-todo.pulse,body.ls26 .l26-where{animation:l26where .55s ease-in-out 3}
@keyframes l26where{50%{outline-color:transparent;box-shadow:0 0 0 6px rgba(229,0,126,.28)}}
/* passi su una riga (come il mockup): fatti e da fare = cerchi, il corrente col nome; un fatto si
   clicca per rileggerlo nella carta */
.l26-steps{display:flex;gap:6px;align-items:center;flex-shrink:0}
.l26-steps .ls26-tl{min-height:30px;font-size:12.5px;border-radius:15px;padding:0 5px;background:var(--bg);border:1px solid var(--border);flex-shrink:0}
.l26-steps .ls26-tl > span:not(.b){display:none}
.l26-steps .ls26-tl.cur{flex:1;min-width:0;padding-right:11px}
.l26-steps .ls26-tl.cur > span:not(.b){display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l26-steps .ls26-tl.cur{border-color:var(--aw-pink)}
.l26-steps .ls26-tl.done{cursor:pointer}.l26-steps .ls26-tl.done:hover,.l26-steps .ls26-tl.rev{border-color:var(--teal)}
.l26-f3{display:grid;flex-shrink:0}
.l26-f3 > *{grid-area:1/1}
.l26-f3 .l26-why{gap:8px}
.l26-f3 .l26-key{margin-top:0}
.l26-f3 .l26-key,.l26-f3.fin .l26-why{visibility:hidden}
.l26-f3.fin .l26-key{visibility:visible}
.l26-chain svg{width:14px;height:14px}
/* ── 08/10 (Giulia, sul modello di BigScreen_prototype): un ordine di lettura solo, dall'alto in basso.
   ① concetto · elenco verticale dei passi · ② carta (alta quanto il testo) · in fondo i chip do/don't.
   Fasi del concetto: "look" (schermata intera + Why + Start) → "steps" → "end" (schermata intera +
   Key message). La vista si muove solo con Start / Next / "See the whole screen" / "Whole screen". */
.l26c > .l26-steps{order:1}.l26c > .l26-card{order:2}.l26c > .l26-f3{order:3}
.l26-card{flex:0 1 auto;min-height:0}
.l26-card.look{border-color:var(--aw-navy)}
.l26-card.look .tag{color:var(--aw-navy)}.l26-card.look .tag i{background:var(--aw-navy)}
.l26-card .whyb{display:flex;flex-direction:column;gap:4px}
.l26-card .whyb b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.l26-card .whyb p{margin:0;font-size:13px;line-height:1.5;color:var(--text2)}
.l26-card .hint{margin-top:0}
.l26-card .keyb{font-size:15px;font-weight:700;line-height:1.45;color:var(--text)}
.l26-card .l26-next{margin-top:4px}
.l26-card .l26-next.nudge{animation:l26nudge .5s ease-out}
@keyframes l26nudge{30%{transform:scale(1.04)}60%{transform:scale(.98)}}
.l26-steps{flex-direction:column;align-items:stretch;gap:0}
.l26-steps .ls26-tl{min-height:30px;border:0;background:none;border-radius:6px;padding:0 6px;font-size:13px}
.l26-steps .ls26-tl > span:not(.b){display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l26-steps .ls26-tl.cur{flex:none;padding-right:6px}
.l26-steps .ls26-tl.done:hover,.l26-steps .ls26-tl.rev{background:var(--teal-l)}
.l26-f3{margin-top:auto}
.l26-steps .l26-recap{margin:-3px 0 6px 35px;font-size:12px;line-height:1.4;color:#0F4D2C;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* 09/10: con 5 passi (concetto 3) l'elenco con i riassunti schiacciava la carta e il bottone copriva il
   Good to know. Ora cede l'ELENCO (scorre, col passo corrente tenuto in vista), non la carta. */
.l26c > .l26-steps{flex:0 10 auto;min-height:64px;overflow-y:auto;position:relative}
.l26c > .l26-card{flex:0 0 auto;max-height:62vh}
.l26c > .l26-steps > *{flex-shrink:0}
.l26c > .l26-steps{scroll-snap-type:y mandatory}.l26c > .l26-steps > .ls26-tl{scroll-snap-align:start}
.l26c > .l26-steps.scrolled{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
.ls26-vf-btn{margin-left:auto;height:26px;border:0;border-radius:7px;background:rgba(255,255,255,.12);color:#fff;font-family:var(--font);font-size:12px;font-weight:700;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ls26-vf-btn:hover{background:rgba(255,255,255,.2)}
.ls26-vf-btn{white-space:nowrap;flex-shrink:0}.ls26-vf-btn svg{width:14px;height:14px;flex-shrink:0}
/* ── 08/10 (ANALISI_FLUSSO_GRAFICO_CONCEPTS, ok di Giulia: A2 + colonna fissa) ───────────────────────────
   Sulla schermata: niente tratteggio. Voce da fare = ALONE rosa morbido fuori dal bordo; voce aperta = alone
   pieno; voce fatta = filo verde tenue fino al Next (G2). Anche il bersaglio dei passi a un clic (.gc-target
   del motore) diventa un alone: un solo segno in tutto il corso. */
body.ls26 .l26-multi .l26-todo{outline:none;border-radius:6px;box-shadow:0 0 0 calc(2px*var(--hs,1)) rgba(229,0,126,.55),0 0 calc(14px*var(--hs,1)) calc(3px*var(--hs,1)) rgba(229,0,126,.35);cursor:pointer;transition:box-shadow .25s}
body.ls26 .l26-multi .l26-vopen{outline:none;border-radius:6px;box-shadow:0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),0 0 calc(20px*var(--hs,1)) calc(6px*var(--hs,1)) rgba(229,0,126,.45);transition:box-shadow .25s}
body.ls26 .l26-multi .l26-vdone{outline:none;border-radius:6px;box-shadow:0 0 0 calc(2px*var(--hs,1)) rgba(46,158,98,.55);transition:box-shadow .25s}
body.ls26 .gc-target{box-shadow:0 0 0 calc(2px*var(--hs,1)) rgba(229,0,126,.6),0 0 calc(16px*var(--hs,1)) calc(4px*var(--hs,1)) rgba(229,0,126,.4)}
body.ls26 .gc-target.gc-ring-in{box-shadow:inset 0 0 0 calc(2px*var(--hs,1)) rgba(229,0,126,.75),inset 0 0 calc(14px*var(--hs,1)) calc(2px*var(--hs,1)) rgba(229,0,126,.3)}
body.ls26 .gc-cleared{box-shadow:0 0 0 calc(2px*var(--hs,1)) rgba(46,158,98,.55)}
@keyframes l26where{50%{box-shadow:0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),0 0 calc(26px*var(--hs,1)) calc(10px*var(--hs,1)) rgba(229,0,126,.55)}}
/* 08/10 (prova di Giulia, §8 bug 2): un segno solo per volta.
   - voce di una checklist appena aperta: un impulso rosa (non più il contorno verde ls26-okflash sopra l'alone);
   - passo a un clic: il contorno verde di 3 px (outline) non si somma al filo verde .gc-cleared: resta il filo, con
     un breve bagliore verde che si spegne;
   - voci annidate (RUNNING dentro la testata): mentre una è aperta, il filo verde dell'altra (fuori o dentro) tace. */
body.ls26 .l26-multi .l26-vopen.l26-vpulse{animation:l26vpulse .7s ease-out}
@keyframes l26vpulse{0%{box-shadow:0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),0 0 0 0 rgba(229,0,126,.6)}45%{box-shadow:0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),0 0 calc(26px*var(--hs,1)) calc(12px*var(--hs,1)) rgba(229,0,126,.55)}100%{box-shadow:0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),0 0 calc(20px*var(--hs,1)) calc(6px*var(--hs,1)) rgba(229,0,126,.45)}}
body.ls26 .ls26-okflash{outline:none!important;animation:l26okpulse .65s ease-out}
@keyframes l26okpulse{0%{box-shadow:0 0 0 calc(2px*var(--hs,1)) rgba(46,158,98,.9),0 0 0 0 rgba(46,158,98,.5)}100%{box-shadow:0 0 0 calc(2px*var(--hs,1)) rgba(46,158,98,.55),0 0 0 calc(10px*var(--hs,1)) rgba(46,158,98,0)}}
body.ls26 .l26-multi .l26-vdone:has(.l26-vopen),body.ls26 .l26-multi .l26-vopen .l26-vdone{box-shadow:none}
/* 08/10: voce che un contenitore taglierebbe (Graphical/Compact nel loro gruppo): stesso segno, ma DENTRO il bordo */
body.ls26 .l26-multi .l26-todo.l26-in{box-shadow:inset 0 0 0 calc(2px*var(--hs,1)) rgba(229,0,126,.8),inset 0 0 calc(10px*var(--hs,1)) calc(3px*var(--hs,1)) rgba(229,0,126,.35)}
body.ls26 .l26-multi .l26-vopen.l26-in{box-shadow:inset 0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),inset 0 0 calc(14px*var(--hs,1)) calc(5px*var(--hs,1)) rgba(229,0,126,.45)}
body.ls26 .l26-multi .l26-vdone.l26-in{box-shadow:inset 0 0 0 calc(2px*var(--hs,1)) rgba(46,158,98,.7)}
body.ls26 .l26-multi .l26-vopen.l26-in.l26-vpulse{animation-name:l26vpulsein}
body.ls26 .l26-in.l26-where,body.ls26 .l26-todo.l26-in.pulse{animation-name:l26wherein}
@keyframes l26vpulsein{45%{box-shadow:inset 0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),inset 0 0 calc(22px*var(--hs,1)) calc(9px*var(--hs,1)) rgba(229,0,126,.6)}}
/* 08/10 (Giulia, decisione "b" sul §8.1): la voce FATTA non ha segno sulla schermata — il verde si confondeva col
   verde di TilliT (RUNNING, barre, OEE). La spunta ✓ resta solo nelle righe della colonna. Vale anche per le porte a
   un clic (.gc-cleared del motore) e per il loro bagliore di conferma: sulla schermata resta solo il rosa del training. */
body.ls26 .l26-multi .l26-vdone,body.ls26 .l26-multi .l26-vdone.l26-in,body.ls26 .gc-cleared{box-shadow:none}
body.ls26 .ls26-okflash{animation:none}
/* 16/10 (Giulia: aloni uniformi): il "dove cliccare" del passo a un clic pulsa come le voci delle checklist (stessa
   misura sullo schermo), non con il gcPulse del motore in pixel fissi */
body.ls26 .gc-target.pulse{animation-name:l26where}
body.ls26 .gc-target.gc-ring-in.pulse{animation-name:l26wherein}
/* 16/10 (Giulia: "la forma intorno al globo"): icona piccola (globo, iniziali) = anello TONDO un po' più largo
   dell'icona, disegnato a parte (::after) e con un bagliore corto, così non esce dal bordo della schermata */
body.ls26 .l26-small{position:relative}
body.ls26 .l26-small:is(.gc-target,.l26-todo,.l26-vopen){box-shadow:none !important;animation:none !important}
body.ls26 .l26-small:is(.gc-target,.l26-todo,.l26-vopen)::after{content:'';position:absolute;left:50%;top:50%;width:calc(var(--l26d) + 8px*var(--hs,1));height:calc(var(--l26d) + 8px*var(--hs,1));
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;box-shadow:0 0 0 calc(2px*var(--hs,1)) rgba(229,0,126,.75),0 0 calc(8px*var(--hs,1)) calc(2px*var(--hs,1)) rgba(229,0,126,.4)}
body.ls26 .l26-multi .l26-vopen.l26-small::after{box-shadow:0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),0 0 calc(10px*var(--hs,1)) calc(3px*var(--hs,1)) rgba(229,0,126,.45)}
body.ls26 .l26-noguide .l26-small::after,body.ls26 .l26-small.l26-vdone:not(.l26-vopen)::after{display:none}
@keyframes l26wherein{50%{box-shadow:inset 0 0 0 calc(3px*var(--hs,1)) var(--aw-pink),inset 0 0 calc(22px*var(--hs,1)) calc(9px*var(--hs,1)) rgba(229,0,126,.6)}}

.p26-bub.them{align-self:flex-start;background:var(--bg2);color:var(--text);border-bottom-left-radius:4px}
.p26-bub.me{align-self:flex-end;background:var(--aw-navy);color:#fff;border-bottom-right-radius:4px}
.p26-bub.me.bad{background:#FFF3DC;color:#8A5A00;border:1px solid #EBCB83}
.p26-bub.typing{display:flex;gap:4px;padding:13px 15px}
.p26-bub.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:p26dot 1s infinite}
.p26-bub.typing span:nth-child(2){animation-delay:.15s}.p26-bub.typing span:nth-child(3){animation-delay:.3s}
@keyframes p26dot{0%,100%{opacity:.3}50%{opacity:1}}
.p26-replies{margin-top:auto;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--border);padding-top:12px}
.p26-replies.wait{min-height:60px}
.p26-eb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.p26-rp{display:flex;align-items:center;gap:11px;width:100%;min-height:46px;border:1px solid var(--border2,var(--border));border-radius:11px;background:var(--bg);padding:9px 13px;font-family:var(--font);font-size:14px;font-weight:600;text-align:left;color:var(--text);cursor:pointer}
.p26-rp span{flex:1}.p26-rp svg{width:16px;height:16px;color:var(--text3)}
.p26-rp:hover{border-color:var(--aw-navy)}
.p26-exl{width:100%;border:0;background:none;font-family:var(--font);text-align:left;cursor:pointer;padding:0}
.p26-link{border:0;background:none;padding:0;font-family:var(--font);font-size:13px;font-weight:700;color:var(--aw-navy);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
[data-theme="dark"] .p26-link{color:var(--text)}
/* pagina adattiva: sotto i 1100 px la colonna va sotto il palco e la pagina scorre */
@media (max-width:1099px){
  body.ls26 .aw-mod-main{height:auto;min-height:calc(100vh - 52px)}
  .ls26-body{flex-direction:column}
  body.ls26 .page-area{overflow:visible}
  .ls26-rail{width:auto;border-left:0;border-top:1px solid var(--border)}
  .ls26-bar{position:sticky;bottom:0;z-index:20}
  .ls26-row3{grid-template-columns:1fr}
  .ls26-hero.has-cover,.ls26-hero.d26-hero{grid-template-columns:minmax(0,1fr)}
  .d26-next{flex-wrap:wrap}
  /* video: la colonna va sotto il player, il testo del video scorre dentro un'altezza fissa */
}
@media (max-width:640px){
  .ls26-head{display:flex;flex-direction:column;align-items:stretch;padding:14px 16px}
  .ls26-hd-r{justify-content:flex-start;flex-wrap:wrap}
  .ls26-head .ls26-hd-r{justify-self:auto}
  .ls26-steps{justify-content:center}.ls26-st{width:60px}
  body.ls26 .page{padding:16px}
  .ls26-rail{padding:16px}
  .ls26-bar{padding:0 16px;gap:10px}
  .ls26-cnt{display:none}
  .ls26-back span{display:none}
  .ls26-main{max-width:70vw}
  .ls26-hero{padding:24px 20px}.ls26-hero h2{font-size:26px}
}
@media print{.ls26-head,.ls26-rail,.ls26-bar{display:none!important}
  /* Done 2026: si stampa il certificato vecchio (nascosto a schermo), non la pagina nuova */
  #page-completion .p26-old{display:block!important}#d26{display:none!important}}
</style>
</head>
<body>
<div class="aw-mod-layout">
<aside class="aw-spath" id="aw-spath"></aside>
<div class="aw-mod-main">
<div class="page-area">

<div class="page" id="page-intro"></div>

<div class="page" id="page-video"></div>

<div class="page" id="page-concepts">
  <div class="pa-banner ls-sh"><div class="pa-banner-in">
    <div class="pa-banner-l">
      <div class="pa-title" id="ls-concepts-title">Key Concepts</div>
      <div class="pa-sub" id="ls-concepts-sub"></div>
    </div>
    <div class="ls-sh-r">
      <span id="concepts-count" style="font-size:13px;font-weight:var(--fw-sb);color:var(--text2)"></span>
      <span id="concepts-done-lbl" style="display:none;font-size:13px;font-weight:var(--fw-sb);color:var(--teal-d)"></span>
      <button class="next-inline hidden" id="concepts-next" onclick="gsNext('concepts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
  </div></div>
  <div class="cpills" id="cpills" style="justify-content:center"></div>
  <div id="cpanels"></div>
</div>

<div class="page" id="page-practice"></div>
<div class="page" id="page-quiz"></div>
<div class="page" id="page-completion"></div>

</div><!-- /page-area -->
<!-- Il footer sta DENTRO .aw-mod-main, non come figlio del body: è la stessa correzione dei
     moduli reali (2026-07-14 ter) — da figlio del body la sua metà sinistra scoprirebbe il
     fondo grigio sotto la colonna bianca delle sezioni. -->
<div class="aw-footer" data-i18n="footer">© {year} autoware · Beyond Operations Management · Training Platform</div>
</div><!-- /aw-mod-main -->
</div><!-- /aw-mod-layout -->

<!-- ══ NOTES & TUTOR ═══════════════════════════════════════════════════════════════════════
     Copiato da OP-03.html (dove vive inline, identico, in tutti e 3 i moduli approvati) e reso
     data-driven: le domande del Tutor arrivano da `sections.tutorFaq` del contratto, che è
     popolato su OGNI lezione del seed e finora non veniva disegnato da nessuna parte.
     ⚠️ Questa è la QUARTA copia dello stesso pannello: centralizzarlo in shared.js è la
     ripulitura giusta, ma tocca i 3 moduli approvati — quindi non qui. ═════════════════════ -->
<button id="unified-fab" onclick="toggleUnifiedPanel()" title="Notes &amp; Tutor"
  style="position:fixed;bottom:28px;right:28px;width:52px;height:52px;border-radius:50%;background:var(--aw-pink);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(224,49,138,.5);z-index:9998;transition:transform .2s"
  onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  <span id="unified-badge" style="display:none;position:absolute;top:-3px;right:-3px;background:#E0318A;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center">0</span>
</button>
<!-- 12/10 (ok di Giulia): pannello nello stile New Design. Note come le card di My Notes; il Tutor
     diventa "Questions" = domande frequenti a fisarmonica (risposte già scritte nel contratto, niente
     finta chat AI). Gli id restano quelli di prima; testi via paintPanel(). -->
<div id="unified-overlay" onclick="toggleUnifiedPanel()"></div>
<div id="unified-panel" role="dialog" aria-labelledby="up-title">
  <div class="up-hd">
    <div class="up-hd-txt">
      <div class="up-title" id="up-title">Notes</div>
      <div id="panel-mod-label" class="up-sub"></div>
    </div>
    <button type="button" class="up-x" id="up-x" onclick="toggleUnifiedPanel()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="up-tabs" role="tablist">
    <button type="button" id="tab-notes-btn" class="up-tab on" role="tab" onclick="switchTab('notes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span id="up-tab-notes">Notes</span><span class="up-count" id="up-count"></span></button>
    <button type="button" id="tab-tutor-btn" class="up-tab" role="tab" onclick="switchTab('tutor')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17h.01"/></svg><span id="up-tab-faq">Questions</span></button>
  </div>
  <div id="tab-notes" class="up-body">
    <div class="up-compose">
      <textarea id="note-text" class="up-ta"></textarea>
      <div class="up-cats" id="note-category" role="radiogroup"></div>
      <div class="up-row">
        <label class="up-live"><input type="checkbox" id="note-live"> <span id="up-live">Live session</span></label>
        <button type="button" class="up-save" id="up-save" onclick="saveNote()">Save note</button>
      </div>
    </div>
    <div id="notes-list" class="up-list">
      <div id="notes-empty" class="up-empty">No notes yet.</div>
    </div>
    <a class="up-all" id="up-all" href="notes.html"><span id="up-all-t">Open all my notes</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
  <div id="tab-tutor" class="up-body" style="display:none">
    <div class="up-faq-sub" id="up-faq-sub"></div>
    <div id="tutor-qs" class="up-faq"></div>
    <div class="up-nothere"><span id="up-nothere">Not here?</span> <button type="button" class="up-link" onclick="faqToNote()"><span id="up-asknote">Save it as a question in your notes</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  </div>
</div>

<script>
// Anteprima "View chapter" dal Content Editor (additivo, 2026-09-10 ter): senza ?preview=1
// nell'URL il comportamento resta quello di sempre — vale anche qui, non solo per OP-01/02/03.html.
var AW_PREVIEW=/[?&]preview=1(?:&|$)/.test(location.search);
var LANG = localStorage.getItem('aw_lang') || 'en';
var LESSON_ID = new URLSearchParams(location.search).get('lesson') || 'OP-03.1';
var DOC = null;
var conceptsSeen = {};
var curConceptIdx = -1;
var seqCfgs = {};
var mockupMount = null;
var mockupActions = null;
// INTERVENTO 4 (Blocco 1, R-14/D2) — l'anello pulsa finché l'elemento non viene cliccato, e si
// spegne appena lo diventa. È un OPT-IN PER PAGINA (decisione Q1 del 18/09): il guscio aderisce,
// `OP-01/02/03.html` no, finché non passano anche loro da qui (decisione D1). Va impostato prima
// di qualunque `gcHot`, quindi qui e non dentro boot().
window.GC_PULSE_WAITING = true; window.GC_STRICT_ORDER = true;
var qIdx = 0, qScore = 0, QUESTIONS = [], PASS_THRESHOLD = 2;
var pIdx = 0, pDone = false;
// SECTS/STEP_DEFS sono assegnati in boot() (Fase 3): dipendono da DOC.sections.video.chapters —
// la sezione Video esiste in nav SOLO se la lezione porta capitoli, altrimenti non compare affatto
// (nessuno stop vuoto "completo": il contratto v1 non autora mai il video, D8 di
// FLUSSO_CONTENUTI_E_TRADUZIONI_v1.md — un asset reale arriverebbe da un canale separato).
var SECTS = ['intro', 'concepts', 'practice', 'quiz', 'completion'];
var STEP_DEFS = SECTS.map(function (id) { return { id: id, labelKey: '', time: '' }; });
var curSect = 'intro';

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function LT(v) { if (v == null) return ''; if (typeof v === 'string') return v; return (v.values && (v.values[LANG] || v.values.en)) || ''; }
function svgEye() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; }
function svgBulb() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>'; }
function svgArrowIco() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'; }
function svgCheckIco() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'; }
function svgLockIco() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'; }

// ═══ Gating (SOLO in memoria in Fase 1 — nessun aw_sect/aw_progress: la generalizzazione
// della persistenza per-sezione è Fase 4, qui l'obiettivo è la fedeltà del motore) ═══
function sectionComplete(sec) {
  // 'video' sempre completo: nessun asset reale da guardare in questo contratto, quindi nessun
  // gate all'80% possibile (a differenza di OP-01/02/03.html, che lo impongono su un file vero) —
  // la sezione non deve mai bloccare Concepts, coerente con "skippabile".
  // 15/10: ora il video vero c'è (pkx_video.js) → "fatto" solo dopo averlo visto all'80% (lsVidWatched); senza file
  // resta sempre fatto. Non blocca comunque nulla: isUnlocked salta il video (resta "skippabile").
  if (sec === 'video') return !lsVideoData() || lsVidWatched;
  if (sec === 'concepts') return DOC.sections.concepts.every(function (c, i) { return !!conceptsSeen[i]; });
  if (sec === 'practice') return practiceComplete();
  if (sec === 'quiz') { var el = document.getElementById('quiz-result'); return !!(el && el.style.display === 'block'); }
  return true;
}
// ── Sezioni accese e "sezione successiva" (25/09) ──
// Prima i bottoni "continua" avevano la destinazione scritta a mano (Video→Concepts,
// Concepts→Practice, Practice→Quiz): con una sezione spenta portavano a una pagina fuori percorso.
function secOn(k) {
  var a = DOC && DOC.meta && DOC.meta.sections;
  return !Array.isArray(a) || a.indexOf(k) >= 0;
}
function nextSect(id) { var i = SECTS.indexOf(id); return (i >= 0 && i < SECTS.length - 1) ? SECTS[i + 1] : null; }
function gsNext(id) {
  var n = nextSect(id);
  if (n) { gs(n); return; }
  if (typeof awPreviewGuard === 'function') awPreviewGuard('modules.html'); else location.href = 'modules.html';
}
// Etichetta del bottone "continua": quella storica se la sezione dopo è quella di sempre,
// altrimenti "Continue" (o "Back to the training" se non c'è una sezione dopo).
function nextLabel(id, usual, usualKey) {
  var n = nextSect(id);
  if (n === usual) return t(usualKey);
  return n ? t('ls.continue', 'Continue') : t('ls.backtotraining', 'Back to the training');
}
// L'attributo data-i18n che applyLang() usa per ritradurre: la chiave giusta per l'etichetta scelta.
function nextI18n(id, usual, usualKey) {
  var n = nextSect(id);
  return ' data-i18n="' + (n === usual ? usualKey : (n ? 'ls.continue' : 'ls.backtotraining')) + '"';
}
// 16/10 sera (Giulia: "presenter mode deve essere tutto sbloccato, anche quiz; la parte finale non ti dice fai il quiz"):
// con Presenter mode niente blocca: sezioni, esercizi della Practice, bottoni della barra e il Done.
function lsPres() { return !!(window.awPresenterOn && awPresenterOn()); }
function isUnlocked(idx) {
  if (lsPres()) return true;   // 14/10 fiera: Presenter mode (menu dell'avatar) → tutte aperte
  for (var i = 0; i < idx; i++) if (SECTS[i] !== 'video' && !sectionComplete(SECTS[i])) return false; return true;
}
// La spunta nella colonna sezioni: una sezione ancora BLOCCATA non può essere "fatta". Senza
// questo filtro Completion nasceva già spuntata (sectionComplete() ritorna true per le sezioni
// senza gate proprio) — i moduli reali usano esattamente lo stesso `stepDone`.
// 02/10: e la sezione IN CORSO non è mai spuntata (come OP-03.html:1535): prima l'Intro risultava
// già "fatta" appena si apriva la lezione.
function stepDone(id) { var i = SECTS.indexOf(id); return i >= 0 && id !== curSect && isUnlocked(i) && sectionComplete(id); }
function renderSteps() {
  // Le etichette usano le stesse chiavi dei moduli reali (`tab.intro`… `tab.completion`, presenti
  // in tutte e 5 le lingue), non più stringhe inglesi riscritte a mano: la colonna delle sezioni
  // si traduce da sola come su OP-01/02/03. I minuti li porta STEP_DEFS (vedi buildStepDefs).
  window.awRenderSteps({
    mount: 'aw-spath', moduleNum: LESSON_ID, moduleTitle: escapeHtml(LT(DOC.sections.intro && DOC.sections.intro.title) || LESSON_ID),
    sections: STEP_DEFS, currentId: curSect, isDone: stepDone, isUnlocked: isUnlocked, onSelect: gs
  });
  // Le chiavi `tab.*` portano il numero DENTRO il testo tradotto ("1. Introduction", "2. Video",
  // "3. Key Concepts"…), perché nei moduli reali le sezioni sono sempre sei. Qui la sezione Video
  // esiste solo se la lezione ha capitoli, quindi senza correzione la colonna elencava 1, 3, 4, 5,
  // 6. Si rinumera il prefisso lasciando intatta la parte tradotta.
  document.querySelectorAll('#aw-spath .aw-step-lbl').forEach(function (el, i) {
    el.textContent = el.textContent.replace(/^\s*\d+\.\s*/, (i + 1) + '. ');
  });
}
// I titoli delle sezioni si traducono con le stesse chiavi `tab.*`, ma SENZA il numero che quelle
// chiavi portano dentro ("3. Key Concepts"): nei moduli reali il numero sta solo nella colonna
// laterale, l'intestazione dice "Key Concepts"/"Practice"/"Quiz" e basta.
function paintSectionTitles() {
  [['ls-video-title', 'tab.video', 'Video'], ['ls-concepts-title', 'tab.concepts', 'Key Concepts'],
   ['ls-practice-title', 'tab.practice', 'Practice'], ['ls-quiz-title', 'tab.quiz', 'Quiz']]
    .forEach(function (r) {
      var el = document.getElementById(r[0]);
      if (el) el.textContent = t(r[1], r[2]).replace(/^\s*\d+\.\s*/, '');
    });
  // Le stringhe con numeri dentro non possono avere un `data-i18n` (applyLang le riscriverebbe
  // col segnaposto grezzo), quindi si ridipingono qui a ogni cambio lingua.
  var cs = document.getElementById('ls-concepts-sub');
  if (cs) cs.textContent = tf('ls.concepts.sub', { n: DOC.sections.concepts.length });
  var dl = document.getElementById('concepts-done-lbl');
  if (dl) dl.textContent = '✓ ' + t('ls.concepts.allseen');
  var qs = document.getElementById('ls-quiz-sub');
  if (qs) qs.textContent = tf('ls.quiz.sub', { n: QUESTIONS.length, p: PASS_THRESHOLD });
  var cl = document.getElementById('cc-locked-sub');
  if (cl) cl.textContent = tf('ls.cc.locked.sub', { p: PASS_THRESHOLD, n: QUESTIONS.length });
  var sc2 = document.getElementById('q-score');
  if (sc2) sc2.textContent = tf('ls.quiz.score', { n: qScore, m: QUESTIONS.length });
  // B4: il messaggio di blocco di ogni esercizio dopo il primo, col numero di quello che lo precede.
  practiceDrills().forEach(function (k, i) {
    var lm = document.getElementById('lock-msg-' + k);
    if (lm) lm.textContent = tf('ls.drill.locked', { n: i });
  });
}
// I moduli reali portano i minuti scritti a mano ("1m/3m/4m/2m/4m"). Qui si stimano dal volume
// del contenuto: non è un dato del contratto, ma una colonna sezioni senza tempi è visibilmente
// diversa da quella dei moduli veri, e un numero derivato non può andare fuori sincrono.
function buildStepDefs() {
  var nC = (DOC.sections.concepts || []).length;
  // B9 (28/09): contava solo i passi di click, ignorando riordino e scenario — una Practice fatta
  // solo di quei due (o con pochi click ma anche i due) risultava sottostimata.
  var nP = ((DOC.sections.practice || {}).steps || []).length + (practiceSequence() ? 1 : 0) + (practiceScenario() ? 1 : 0);
  var nQ = (((DOC.sections.quiz || {}).questions) || []).length;
  var chs = ((DOC.sections.video || {}).chapters) || [];
  var vSec = chs.reduce(function (mx, c) { return Math.max(mx, c.timestampSeconds || 0); }, 0);
  if (lsVideoData()) vSec = lsVideoData().text[lsVideoLang()].duration;   // video vero: la sua durata
  var mins = {
    intro: '1m',
    video: (vSec ? Math.max(1, Math.ceil(vSec / 60)) : 3) + 'm',
    concepts: Math.max(2, nC) + 'm',
    practice: Math.max(2, nP) + 'm',
    quiz: Math.max(2, nQ) + 'm',
    completion: ''
  };
  return SECTS.map(function (id) { return { id: id, labelKey: 'tab.' + id, time: mins[id] }; });
}
function refreshGates() {
  renderSteps();
  var total = DOC.sections.concepts.length;
  var done = DOC.sections.concepts.filter(function (c, i) { return conceptsSeen[i]; }).length;
  var allDone = done === total;
  var countEl = document.getElementById('concepts-count'); if (countEl) { countEl.style.display = allDone ? 'none' : ''; countEl.textContent = done + ' / ' + total; }
  var doneLbl = document.getElementById('concepts-done-lbl'); if (doneLbl) doneLbl.style.display = allDone ? '' : 'none';
  var nextBtn = document.getElementById('concepts-next'); if (nextBtn) nextBtn.classList.toggle('hidden', !allDone);
  document.querySelectorAll('.cp').forEach(function (p, i) { p.classList.toggle('done', !!conceptsSeen[i]); });
  persistProgress();
}

// ═══ PERSISTENZA per-sezione (Fase 4) — stessa chiave `aw_sect`/`aw_progress` dei moduli reali,
// generalizzata da MODID a 2 cifre a LESSON_ID reale (es. "OP-03.1"): awSaveSect/awLoadSect in

    // refreshGates() → persistProgress(), che riscrive aw_sect con lo score ancora a 0 di default —
    // rileggere qui lo troverebbe già azzerato.
    qScore = (typeof savedScore === 'number' && savedScore > 0) ? savedScore : PASS_THRESHOLD;
    document.getElementById('q-score').textContent = tf('ls.quiz.score', { n: qScore, m: QUESTIONS.length });

// B5 (28/09): la data/ora "Completed" del certificato era sempre `new Date()` disegnata al momento,

// di aw_progress); non scritta in anteprima autore (AW_PREVIEW), come aw_progress stesso.
function awMarkCompletedAt() {
  try {
    var m = JSON.parse(localStorage.getItem('aw_progress_at') || '{}');
    if (!m[LESSON_ID]) { m[LESSON_ID] = new Date().toISOString(); localStorage.setItem('aw_progress_at', JSON.stringify(m)); }
  } catch (e) { /* niente storage: si ricade su "adesso" in populateCompletionCard */ }
}
function awCompletedAt() {
  try {
    var m = JSON.parse(localStorage.getItem('aw_progress_at') || '{}');
    return m[LESSON_ID] ? new Date(m[LESSON_ID]) : null;
  } catch (e) { return null; }
}
function restoreProgress() {
  var saved = (typeof awLoadSect === 'function') ? awLoadSect(LESSON_ID) : { done: [], last: null };
  var full = false; try { var p = JSON.parse(localStorage.getItem('aw_progress') || '{}'); full = p[LESSON_ID] === true; } catch (e) {}
  var toRestore = full ? SECTS.slice() : (saved.done || []);
  var savedScore = saved.score;
  toRestore.forEach(function (s) { if (s !== 'intro' && s !== 'completion' && SECTS.indexOf(s) >= 0) restoreSection(s, savedScore); });
  var start = SECTS[0];
  if (full) { start = SECTS[SECTS.length - 1]; }
  else if (saved.last && SECTS.indexOf(saved.last) >= 0 && saved.last !== 'completion') { start = saved.last; }
  else if ((saved.done || []).some(function (s) { return s !== 'intro' && s !== 'completion'; })) {
    for (var i = 0; i < SECTS.length; i++) { start = SECTS[i]; if (SECTS[i] !== 'video' && !sectionComplete(SECTS[i])) break; }
  }
  // altrimenti: nessun progresso reale (utente nuovo) → resta 'intro'
  // 02/10: se la sezione salvata ora risulta bloccata (es. lezione ripubblicata con una sezione in
  // più), gs() mostrava solo l'avviso e nessuna pagina → pagina bianca. Si arretra fino a una aperta.
  var si = SECTS.indexOf(start);

function gs(id) {

  if (idx > 0 && !isUnlocked(idx)) { if (window.awToast) window.awToast(t('nav.locked', 'Complete the current chapter to proceed.')); return; }
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById('page-' + id).classList.add('active');
  curSect = id; window.scrollTo(0, 0); refreshGates();
  // Video: si ferma uscendo dalla sezione; entrando, il pannello si misura (a display:none valeva 0).
  var vEl = document.getElementById('va-video');
  if (vEl && id !== 'video' && !vEl.paused) vEl.pause();
  if (id === 'video' && window.awVaSyncHeight) setTimeout(function () { lsVideoFit(); window.awVaSyncHeight(); lsVideoFitList(); }, 0);
  // L'anteprima-dispositivo si misura solo quando l'Intro è visibile: a `display:none` la
  // larghezza disponibile è 0 e la scala verrebbe calcolata su niente.
  if (id === 'intro') scaleIntroPreview();
  if (id === 'concepts') { sc(curConceptIdx >= 0 ? curConceptIdx : 0); }

    }
