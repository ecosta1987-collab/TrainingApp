// 24/09 — testo di lato anche sotto i 1500px (vedi il CSS di `body.ls-side-fit`). La larghezza
// che il contenuto AVREBBE con le barre strette si calcola dalle misure di adesso (niente attesa
// della transizione): attuale + quanto si libera dal rail (->64) e dalla colonna lezione (->52).
// Si affianca solo se il palco resta >= 700px + i 24 di bordo del riquadro: altrimenti si lascia
// il layout impilato di prima. Le classi del rail si toccano senza awToggleRail(), che salverebbe
// la preferenza: qui si ricorda solo lo stato di partenza e lo si rimette uscendo.
// Vale anche SOPRA i 1500: fra 1500 e ~1610 il layout normale (barre aperte + testo a 380)
// lasciava al palco meno di 700px e il mockup scalava (0,99 misurato a 1600). Regola unica:
// si stringono le barre quando il layout normale rimpicciolirebbe il mockup o metterebbe il
// testo sotto, e solo se stringendole il mockup ci sta intero.
var LS_FIT_SIDE = 320, LS_SIDE_WIDE = 380, LS_FIT_MIN = 700 + 24, lsRailWasOpen = null;
function lsSideFit() {
  var b = document.body, on = b.classList.contains('ls-side-fit'), want = false;
  var cp = document.getElementById('cpanels');
  if (curSect === 'concepts' && cp && cp.clientWidth) {
    var rail = document.querySelector('.aw-rail'), sp = document.querySelector('.aw-spath');
    var gap = 0, act = document.querySelector('#cpanels .cpanel.active');
    if (act) gap = parseFloat(getComputedStyle(act).columnGap) || 0;
    // Quanto si libera stringendo: rail 220->64 (solo se era aperto), colonna lezione 188->52.
    var railOpen = on ? !!lsRailWasOpen : b.classList.contains('aw-rail-open');
    var freed = (railOpen ? 220 - 64 : 0) + ((sp ? (on ? 188 : sp.getBoundingClientRect().width) : 188) - 52);
    var wide = on ? cp.clientWidth - freed : cp.clientWidth;      // contenuto con le barre normali
    var narrow = on ? cp.clientWidth : cp.clientWidth + freed;    // contenuto con le barre strette
    var normalOk = window.innerWidth >= 1500 && wide - LS_SIDE_WIDE - gap >= LS_FIT_MIN;
    want = !normalOk && narrow - LS_FIT_SIDE - gap >= LS_FIT_MIN;

  if (want === on) return;
  if (want) {
    lsRailWasOpen = b.classList.contains('aw-rail-open');
    b.classList.remove('aw-rail-open');
    b.classList.add('ls-side-fit');
    document.querySelectorAll('.aw-spath .aw-step').forEach(function (s) {
      var l = s.querySelector('.aw-step-lbl'); if (l && !s.title) s.title = l.textContent.trim();
    });
  } else {
    b.classList.remove('ls-side-fit');
    if (lsRailWasOpen && !b.classList.contains('aw-rail-open')) b.classList.add('aw-rail-open');
    lsRailWasOpen = null;
  }
  // Il palco ha cambiato larghezza: si ricalcola la vista del concetto (subito e a transizione
  // finita, 240ms) e la barra dei passi.
  var redo = function () {
    if (curSect === 'concepts' && curConceptIdx >= 0 && mockupMount) applyConceptView(mockupMount, DOC.sections.concepts[curConceptIdx]);
    document.querySelectorAll('.cpanel.active .gc-path').forEach(fitGcPath);

// L'anteprima-dispositivo mostra il mockup VERO della lezione, clonato. `cloneNode(true)` non
// copia i listener e il `behaviour` del cromo è agganciato all'istanza originale, quindi il clone
// è inerte per costruzione (il `pointer-events:none` di `.ls-devfit-in` è la cintura oltre alle
// bretelle). Va chiamata DOPO mountMockup(), che è chi costruisce MOCKS.
function mountIntroPreview() {
  var box = document.getElementById('ls-devfit'), inner = document.getElementById('ls-devfit-in');
  if (!box || !inner) return;
  var cover = introCover();
  var m = cover.kind === 'screen' ? MOCKS[mockKey(cover.sim)] : null;
  // Simulatore dichiarato ma senza mockup in libreria: si toglie il riquadro e l'Intro torna a
  // una colonna, invece di lasciare metà pagina vuota.
  if (!m) {
    var v = box.closest('.iv-visual'); if (v) v.style.display = 'none';

  // 02/10: dal markup ORIGINALE (m.html), non dal mockup vivo: dopo un cambio lingua l'anteprima
  // copiava la schermata nello stato in cui l'avevano lasciata concetti e Practice. Della radice si
  // tengono solo le classi di scoping (`ls-mock ls-mock-<sim>`), non quelle di vista/ritaglio.
  var clone = document.createElement('div');

  // Il motore condiviso risolve gli elementi con `document.getElementById`, e il clone sta PRIMA
  // dei pannelli concetto nell'ordine del documento: con gli id duplicati l'anello finiva sul
  // clone (inerte) invece che sul mockup vivo, e i concetti non avanzavano più di un passo.
  // Misurato: il ring compariva su `sv-date` ma cliccarlo lasciava la checklist a 0/1.
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(function (e) { e.removeAttribute('id'); });
  clone.querySelectorAll('[data-zone],[data-ls-item],[data-gc-item]').forEach(function (e) {

function scaleIntroPreview() {

  box.style.height = Math.round(inner.getBoundingClientRect().height) + 'px';

// ── Drag & drop del riordino ─────────────────────────────────────────────────────────────────
// Trascritto dal comportamento di OP-01.html: prendere una riga, lasciarla in uno slot, e se lo
// slot era occupato la riga che c'era torna in cima. `seqPlaced` mappa slot → indice corretto.
// ⚠️ HTML5 drag & drop non funziona da touch: è la stessa limitazione dei moduli reali, ereditata
// di proposito per non introdurre un comportamento che la pagina pubblicata non ha.
var seqDragged = null;
function seqDragStart(e) { seqDragged = e.currentTarget; e.currentTarget.style.opacity = '.4'; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', e.currentTarget.dataset.seq); }
function seqDragEnd(e) { e.currentTarget.style.opacity = '1'; }
function seqDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
function seqDragLeave(e) { e.currentTarget.classList.remove('over'); }
function seqDrop(e) {
  e.preventDefault();
  var zone = e.currentTarget; zone.classList.remove('over');
  if (seqDoneFlag) return;
  var idx = e.dataTransfer.getData('text/plain');
  var item = document.querySelector('#pex-sequence .drag-item[data-seq="' + idx + '"]');
  if (!item) return;
  var src = document.getElementById('seq-source');
  var existing = zone.querySelector('.drag-item');
  if (existing) { src.appendChild(existing); existing.style.opacity = '1'; }
  // Se l'elemento veniva da un altro slot, quello slot torna vuoto.
  Object.keys(seqPlaced).forEach(function (s) { if (String(seqPlaced[s]) === String(idx)) delete seqPlaced[s]; });
  var ph = zone.querySelector('.drop-placeholder'); if (ph) ph.style.display = 'none';
  zone.appendChild(item);
  seqPlaced[zone.dataset.slot] = idx;
  document.querySelectorAll('#seq-zones .drop-zone').forEach(function (z) {
    var has = !!z.querySelector('.drag-item');
    var p = z.querySelector('.drop-placeholder'); if (p) p.style.display = has ? 'none' : '';
  });
}
window.seqDragStart = seqDragStart; window.seqDragEnd = seqDragEnd;
window.seqDragOver = seqDragOver; window.seqDragLeave = seqDragLeave; window.seqDrop = seqDrop;
function seqCheck() {
  var seq = practiceSequence(); if (!seq || seqDoneFlag) return;
  var total = (seq.items || []).length;
  var fb = document.getElementById('seq-fb');
  fb.style.display = 'block';
  if (Object.keys(seqPlaced).length < total) {
    fb.className = 'sim-fb ko'; fb.textContent = tf('ls.seq.empty', { n: total });
    return;
  }
  var ok = true;
  for (var s = 0; s < total; s++) if (String(seqPlaced[s]) !== String(s)) ok = false;
  if (!ok) {
    fb.className = 'sim-fb ko';
    fb.textContent = LT(seq.feedbackKo) || t('ls.seq.ko');
    return;
  }
  fb.style.display = 'none';
  seqDoneFlag = true;
  document.getElementById('seq-done').style.display = 'block';
  document.querySelectorAll('#pex-sequence .drag-item').forEach(function (el) { el.setAttribute('draggable', 'false'); el.style.cursor = 'default'; });
  unlockNextDrill('sequence');
  paintPracticeMeter(); refreshGates();
}
window.seqCheck = seqCheck;

// Sblocca l'esercizio successivo nella lista (qualunque sia) e marca quello appena concluso.
function unlockNextDrill(kind) {
  var ds = practiceDrills(), i = ds.indexOf(kind);
  var chk = document.getElementById('pa-check-' + kind); if (chk) chk.textContent = '✓';
  var box = document.getElementById('drill-' + kind); if (box) box.classList.add('is-done');
  var nx = ds[i + 1]; if (!nx) return;
  var lock = document.getElementById('lock-' + nx); if (lock) lock.style.display = 'none';
  var body = document.getElementById('pex-' + nx); if (body) body.style.display = 'block';
  // B2 (24/09 notte): la vista del mockup era calcolata quando l'esercizio era ancora nascosto
  // (larghezza 0) e non veniva rifatta allo sblocco: il mockup restava a 900 px, fuori dal palco,
  // finche' non si ridimensionava la finestra. Si ricalcola adesso che l'esercizio e' visibile.
  if (nx === 'click' && mockupMount) {
    var _st = (DOC.sections.practice && DOC.sections.practice.steps) || [];
    if (_st[pIdx]) applyPracticeView(mockupMount, _st[pIdx]);
  }
}
// `initScenario` non ha una callback di fine: mostra e basta l'elemento `doneId`. Invece di
// toccare shared.js (che pilota anche i 3 moduli approvati) si osserva quell'elemento: quando
// diventa visibile, il drill 02 è concluso.
function armScenario(scn) {
  var cfg = {
    msgsId: 'p-msgs', qbtnsId: 'p-qbtns', doneId: 'scenario-done',
    branches: scnBranches(scn.options)
  };
  if (scn.next && (scn.next.options || []).length) {
    cfg.next = {
      promptKey: LT(scn.next.prompt),
      options: (scn.next.options || []).map(function (o) { return { i18nKey: LT(o.text), branch: o.id }; }),
      branches: scnBranches(scn.next.options)
    };
  }
  window.initScenario(cfg);
  if (scnObserver) scnObserver.disconnect();
  var el = document.getElementById('scenario-done');
  if (!el) return;
  scnObserver = new MutationObserver(function () {
    if (el.style.display && el.style.display !== 'none' && !scnDoneFlag) {
      scnDoneFlag = true;
      unlockNextDrill('scenario');
      paintPracticeMeter(); refreshGates();
    }
  });
  scnObserver.observe(el, { attributes: true, attributeFilter: ['style'] });
}
// Il motore risolve reply/prompt con `t(key)`, che ritorna la chiave stessa quando non è nel
// dizionario: passandogli il TESTO già risolto dal contratto si ottiene il testo. È lo stesso
// meccanismo di fallback documentato per `gcT`, non un abuso.
function scnBranches(options) {
  var out = {};
  (options || []).forEach(function (o) {
    out[o.id] = { verdict: (o.verdict === 'ok' || o.verdict === 'partial') ? o.verdict : 'ko', reply: LT(o.reply) };
  });
  return out;
}
function paintPracticeMeter() {
  var ds = practiceDrills(), total = ds.length || 1;
  var done = ds.filter(drillDone).length;
  var lbl = document.getElementById('pa-done'); if (lbl) lbl.textContent = done + '/' + (ds.length || 0);
  var fill = document.getElementById('pa-fill'); if (fill) fill.style.width = Math.round(done / total * 100) + '%';
  ds.forEach(function (k) {
    var m = document.getElementById('pa-ms-' + k); if (m) m.classList.toggle('done', drillDone(k));
  });
  var pr = document.getElementById('practice-result'); if (pr) pr.classList.toggle('show', practiceComplete());

// 02/10 (fiera): errori in Practice "parlanti" come in OP-03 — scossa sull'elemento cliccato, e dal
// secondo errore sullo stesso passo il bersaglio si illumina (gcHot, lo stesso anello dei concetti).
var pMiss = 0;
function practiceClick(id, srcEl) {
  if (pDone) return;
  var steps = (DOC.sections.practice && DOC.sections.practice.steps) || [];
  var step = steps[pIdx]; if (!step) return;
  var fb = document.getElementById('p-fb');
  if (!fb) return;
  fb.style.display = 'block';
  if (id && id === step.targetId) {
    if (window.gcHot) window.gcHot(null);
    fb.className = 'sim-fb ok'; fb.textContent = '✓ ' + (LT(step.feedbackOk) || t('ls.practice.ok', 'Correct.'));
    // 2026-09-08: gli step possono portare i propri `effects` (come gli item dei Concept), per gli
    // stessi motivi — un target puo' essere visibile solo dopo un click precedente (es. le iniziali
    // dopo il login). Applicati sul mockup ancora montato, prima di un eventuale swap di simulatore.
    if ((step.effects || []).length && window.gcApplyEffects) window.gcApplyEffects(step.effects, mockupMount);
    pIdx++;
    if (pIdx >= steps.length) { pDone = true; setTimeout(showPracticeDone, 700); }
    else setTimeout(renderPracticeStep, 900);
  } else {
    pMiss++;
    var msg = '✗ ' + (LT(step.feedbackKo) || t('ls.practice.ko', 'Not there. Read the task again and try another spot.'));
    if (pMiss >= 2 && step.targetId) {
      msg += ' ' + t('ls.practice.highlight', 'Hint: the right spot is now highlighted.');
      if (window.gcHot) window.gcHot(step.targetId, true, mockupMount);
    }
    fb.className = 'sim-fb ko'; fb.textContent = msg;
    // Riavvia l'animazione anche su due errori di fila sullo stesso elemento.
    var sh = srcEl && srcEl.classList ? srcEl : fb;
    sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
    setTimeout(function () { sh.classList.remove('shake'); }, 400);
  }
}
// Il mockup che contiene un dato elemento del manifest. Serve perché una Practice può legittimamente
// attraversare DUE schermate: OP-01.1 chiede prima il bottone di login (LoginSimulator) e poi
// l'icona della lingua (LanguageSwitcher).
// ⚠️ Chi possiede un id, quando PIÙ schermate lo contengono? Dalla Fase A le schermate `SV.*`
// sono composte sulla stessa Base, quindi `po-order`, `tab-evt`, `cnt-open`… stanno in TUTTE.
// Scorrendo `MOCKS` in ordine d'inserimento (= ordine dei concetti) vinceva la schermata del
// PRIMO concetto, non quella che la Practice dichiara: su OP-03.1 la Practice chiedeva `SV.Base`
// e si ritrovava montata `SV.DatePicker`. Peggio: `slot.appendChild` non toglie la precedente,
// quindi nel palco finivano DUE Station View impilate e i click andavano su quella sbagliata.
// Misurato dal vivo il 2026-09-22. Ora la schermata dichiarata ha la precedenza quando possiede
// l'id; il giro su tutte resta come ripiego, che è il caso per cui `mockOwningId` è nato
// (OP-01.1 passo 3, `ls-globe`, che vive in un simulatore diverso da quello dichiarato).
function mockOwningId(id, preferSimId) {
  var pref = preferSimId ? MOCKS[mockKey(preferSimId)] : null;
  if (pref && (pref.ids || []).indexOf(id) >= 0) return pref;
  var found = null;
  Object.keys(MOCKS).forEach(function (k) {
    if (!found && (MOCKS[k].ids || []).indexOf(id) >= 0) found = MOCKS[k];
  });
  return found;
}
function renderPracticeStep() {
  var steps = (DOC.sections.practice && DOC.sections.practice.steps) || [];
  if (pDone || !steps.length) { showPracticeDone(); return; }
  // ⚠️ Bug reale trovato il 2026-09-10: la Practice montava UN SOLO mockup per tutta la sezione
  // (quello di `mockupVariant`), quindi uno step che punta a un elemento di un'altra schermata era
  // **impossibile da completare** — su OP-01.1 lo step 3 (`ls-globe`, LanguageSwitcher) non era
  // raggiungibile e la Practice restava bloccata a 2/3 per sempre. `validateSubsection` non poteva
  // vederlo: `practiceManifest()` fonde i manifest di tutti i simulatori della lezione, quindi
  // l'id risultava valido. Ora il palco segue lo step, come già fa per i concetti.
  var want = steps[pIdx] && steps[pIdx].targetId;
  var owner = want ? mockOwningId(want, DOC.sections.practice && DOC.sections.practice.mockupVariant) : null;
  if (owner && owner.el !== mockupMount) {
    activateMock(owner.simId);
    resetMockupToOriginal();
    var slot = document.getElementById('practice-slot');
    // `replaceChildren`, non `appendChild`: con una sola schermata per lezione erano equivalenti
    // (si ri-appendeva sempre lo stesso elemento), con due diventano due mockup impilati nel
    // palco. Un palco, una schermata.
    if (slot) { while (slot.firstChild) slot.removeChild(slot.firstChild); slot.appendChild(owner.el); }
  }
  // Blocco 01 — il ritaglio vale anche in Practice, derivato dal target del passo: altrimenti si
  // mostra la Station View intera per chiedere di cliccare una riga. Va applicato a OGNI passo
  // (non solo al cambio di mockup): gcApplyView pulisce da sé la vista del passo precedente.
  if (mockupMount) applyPracticeView(mockupMount, steps[pIdx]);
  // INTERVENTO 3 (D3) — la Practice riceve SEMPRE 'all': è lì che si esplora liberamente. Ad ogni
  // passo (non solo all'ingresso) perché uno swap di mockup montando un `el` diverso altrimenti
  // erediterebbe qualunque cromo quel simulatore avesse l'ultima volta (un concetto, 'off').
  if (mockupMount) window.gcSetChrome(mockupMount, 'all');
  // 23/09 sera (decisione di Giulia): come nei concetti, la lista DENTRO il mockup scorre da sola
  // fino al bersaglio del passo (mai la pagina). Dopo la vista, che cambia scala e ritaglio.
  if (mockupMount && want && window.gcRevealInScroller) {
    var tgtEl = null; try { tgtEl = mockupMount.querySelector('#' + CSS.escape(want)); } catch (e) {}
    if (tgtEl) setTimeout(function () { window.gcRevealInScroller(tgtEl, mockupMount); }, 60);
  }
  document.getElementById('p-count').textContent = tf('gc.stepfmt', { n: pIdx + 1, m: steps.length });
  document.getElementById('p-task').textContent = LT(steps[pIdx].instruction);
  var fb = document.getElementById('p-fb'); fb.style.display = 'none'; fb.textContent = '';
  pMiss = 0; if (window.gcHot) window.gcHot(null);
}
function showPracticeDone() {
  // Click-simulation conclusa: spunta, bordo teal, e sblocco in-place dell'esercizio successivo
  // (il placeholder col lucchetto sparisce) — stessa meccanica di `goToPracticeStep(2)` nei
  // moduli reali.
  unlockNextDrill('click');
  paintPracticeMeter();
  var pc = document.getElementById('p-count'); if (pc) pc.textContent = '';
  // B3 (25/09): una Practice con solo riordino o solo scenario non disegna l'esercizio di click,
  // quindi `p-task`/`p-fb` non esistono e qui c'era un TypeError.
  var pt = document.getElementById('p-task'); if (pt) pt.textContent = '';
  var pf = document.getElementById('p-fb'); if (pf) pf.style.display = 'none';

}

// I moduli reali chiudono con una card "Up next" scritta a mano (`op03.next.name/sub`). Qui il
// prossimo capitolo si legge dalla tassonomia vera dello stato editor, quindi segue i rinomini e
// i capitoli nuovi da sé. Resta DENTRO lo stesso corso: l'ultima lezione OP non rimanda alla
// prima SU (sono due corsi con un gate fra loro, non una sequenza sola).
function nextLesson() {
  var st = (typeof awEditorState === 'function') ? awEditorState() : null;
  if (!st) return null;
  var want = String(LESSON_ID).toUpperCase(), track = null;
  (st.modules || []).forEach(function (m) {
    (m.subsections || []).forEach(function (ss) { if (String(ss.id || '').toUpperCase() === want) track = m.trackId; });
  });
  var flat = [];
  (st.modules || []).forEach(function (m) {
    if (track != null && m.trackId !== track) return;
    (m.subsections || []).forEach(function (ss) {
      // fuori dall'anteprima "pronto" = pubblicato (PUB_SET), non `ready` nell'editor
      var st = PUB_SET ? (PUB_SET[String(ss.id).toUpperCase()] ? 'ready' : 'draft') : (ss.status || 'draft');
      flat.push({ id: ss.id, title: ss.title || ss.id, status: st });
    });
  });
  for (var i = 0; i < flat.length; i++) {
    if (String(flat[i].id).toUpperCase() === want) return (i + 1 < flat.length) ? flat[i + 1] : null;
  }
  return null;
}

// I testi dei capitoli PKX sono in inglese nei copioni; le traduzioni stanno nel dizionario delle frasi
// (pkx_translations.js, PKX_DICT: "frase inglese" → {it, es, pt-BR, hi}). Al caricamento della lezione:
// - un testo multilingua ({values:{en}}) riceve le altre lingue dal dizionario (LT() sceglie la lingua);
// - una stringa semplice si sostituisce con la traduzione, e si ricorda dov'era per il cambio di lingua.
// Una frase che non è nel dizionario resta in inglese. Senza dizionario non cambia niente.
var L10N_SLOTS = [], L10N_LANG0 = null;
function l10nDoc(doc) {
  if (!window.PKX_DICT || !doc) return;
  L10N_LANG0 = LANG;
  (function walk(o) {
    if (!o || typeof o !== 'object') return;
    if (o.values && typeof o.values === 'object' && typeof o.values.en === 'string') {
      var e = PKX_DICT[o.values.en];
      if (e) Object.keys(e).forEach(function (l) { if (!o.values[l]) o.values[l] = e[l]; });
      return;
    }
    Object.keys(o).forEach(function (k) {
      var v = o[k];
      if (typeof v === 'string') { if (PKX_DICT[v]) { L10N_SLOTS.push({ o: o, k: k, en: v }); o[k] = awDictT(v); } }
      else if (v && typeof v === 'object') walk(v);
    });
  })(doc);
}
function l10nRelang() { L10N_SLOTS.forEach(function (x) { x.o[x.k] = awDictT(x.en); }); }

function boot(doc) {

// Prima questa pagina leggeva SOLO `../Content/<id>.json`, e su disco esistono 2 file su 37
// lezioni: l'export scarica un file che va salvato a mano, quindi il catalogo non era
// percorribile e ogni giro di anteprima costava un export. Ora l'ordine è:
//
//   1. STATO VIVO del content editor (`localStorage`, stesso origin) — via awLessonDoc()
//      in shared.js, la stessa trasformazione che usa l'export di consegna.
//   2. il file su disco, come prima — resta la strada per una lezione congelata e
//      committata nel repo (e per chi non ha lo stato dell'editor in questo browser).
//
// `?src=file` forza il file (utile per confrontare il congelato col vivo); `?src=live` forza
// lo stato vivo senza ricadere sul file, così un dato mancante si vede invece di passare
// inosservato dietro un vecchio JSON.
// Nota: leggendo lo stato vivo non serve `fetch`, quindi la pagina funziona anche su `file://`,
// dove `fetch` è bloccato da CORS.
var SRC = new URLSearchParams(location.search).get('src') || '';
var DOC_SOURCE = '';

function srcBadge() {
  // Da dove viene il contenuto interessa a chi sta autorando, non a chi fa il corso: il badge
  // compare solo in anteprima (`?preview=1`). Un capitolo pubblicato non deve mostrare all'utente
  // la parola "editor state".
  if (!AW_PREVIEW) return '';
  if (!DOC_SOURCE) return '';
  var live = DOC_SOURCE === 'live';
  return '<span class="ls-pilot-badge" title="' + (live
      ? 'Built from the live content editor state in this browser (localStorage) — no export needed'
      : 'Read from the committed file Content/' + escapeHtml(LESSON_ID) + '.json')
    + '">' + (live ? 'Live editor state' : 'Content/' + escapeHtml(LESSON_ID) + '.json') + '</span>';
}

function showLoadError(html) {
  document.querySelector('.page-area').innerHTML = '<div class="ls-loaderr">' + html + '</div>';
}

// 2026-09-25 (PIANO_PUBBLICAZIONE): chi impara vede la versione PUBBLICATA del sotto-training
// (IndexedDB, awPubAll in shared.js), non lo stato vivo dell'editor. Lo stato vivo resta per
// l'ANTEPRIMA di chi scrive: `?preview=1` (il "View chapter" dell'editor) o `?src=live`.
// `?src=file` legge il file congelato come prima. Senza versione pubblicata si ricade sul file.
var PUB_SET = null;   // capitoli pubblicati (maiuscolo) — usato dal link "capitolo successivo"
function loadDoc() {
  if (SRC !== 'file' && SRC !== 'live' && !AW_PREVIEW && typeof awPubAll === 'function') {
    var tenantId = (typeof awLearnerTenantId === 'function') ? awLearnerTenantId() : null;
    awPubAll().then(function (pubs) {
      PUB_SET = awPubLessonSet(pubs, tenantId);
      var doc = awPubLessonDoc(pubs, LESSON_ID, tenantId);
      if (doc) {
        // Periodo di disponibilità (2026-09-25): fuori periodo la lezione non si apre; i
        // progressi restano. L'anteprima dell'editor non passa di qui.
        var acc = (typeof awAccessStatus === 'function') ? awAccessStatus(doc.meta && doc.meta.trackId) : { status: 'open' };
        if (acc.status !== 'open') {
          showLoadError(acc.status === 'ended'
            ? 'This training is no longer available.<br><small>Access ended on ' + escapeHtml(awFmtDay(acc.until)) + '. Your progress is kept. <a href="modules.html">Back to the training</a></small>'
            : 'This training is not available yet.<br><small>It opens on ' + escapeHtml(awFmtDay(acc.from)) + '. <a href="modules.html">Back to the training</a></small>');
          return;
        }
        DOC_SOURCE = 'published'; boot(doc); return;
      }
      // Non pubblicato. Se in questo browser c'è l'editor, il vecchio file congelato in
      // Content/ NON va mostrato (sarebbe una versione mai pubblicata, spesso vecchia): si dice
      // che il capitolo non è ancora disponibile. Il file resta solo per un browser senza editor.
      if (typeof awEditorState === 'function' && awEditorState()) {
        showLoadError('This chapter is not published yet.'
          + '<br><small>It is still being prepared. <a href="modules.html">Back to the training</a></small>');
        return;
      }
      loadDocFile('This chapter is not published yet.');
    });
    return;
  }
  loadDocLive();
}
function loadDocLive() {
  if (SRC !== 'file' && typeof awEditorState === 'function') {
    // 02/10: aperta da "View chapter" dentro un workspace (es. packexpo), l'anteprima deve leggere
    // la memoria dell'editor DI QUEL workspace (`aw_ws_<nome>`), non quella del laboratorio: prima
    // il capitolo risultava "not in the live content editor state" perché esiste solo lì.
    var st = null;
    if (window.AW_WS_PREVIEW) {
      try { st = JSON.parse(localStorage.getItem('aw_ws_' + window.AW_WS_PREVIEW) || 'null'); } catch (e) { st = null; }
      if (!st || !st.modules || !st.modules.length) st = null;
    }
    st = st || awEditorState();
    var live = st ? awLessonDoc(st, LESSON_ID) : null;
    if (live) { DOC_SOURCE = 'live'; boot(live); return; }
    if (SRC === 'live') {
      showLoadError('Lesson <code>' + escapeHtml(LESSON_ID) + '</code> is not in the live content editor state.'
        + '<br><small>' + (st ? 'The editor state exists but has no lesson with this id.' : 'No content editor state in this browser &mdash; open the Content Editor once, or drop <code>?src=live</code> to fall back to the file.') + '</small>');
      return;
    }
  }
  loadDocFile('Not in the live content editor state of this browser.');
}
function loadDocFile(why) {
  fetch('../Content/' + LESSON_ID + '.json').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (doc) { DOC_SOURCE = 'file'; boot(doc); }).catch(function (err) {
    showLoadError('Could not load lesson <code>' + escapeHtml(LESSON_ID) + '</code>.'
      + '<br><small>' + escapeHtml(why) + ' And <code>Content/' + escapeHtml(LESSON_ID) + '.json</code> failed: ' + escapeHtml(err.message) + '</small>');
  });
}

// Cambio lingua dalla topbar: senza questo aggancio (che i 3 moduli reali hanno) applyLang
// ridipingeva i [data-i18n] della colonna sezioni e cancellava la rinumerazione degli step, e le
// etichette del pannello note restavano nella lingua precedente.
// ⚠️ Il TESTO DEL CAPITOLO non cambia lingua: il contratto porta oggi solo `values.en` e LT()
// ricade su quello. È il Blocco B, non un difetto di questo giro.
window._onLangChange = function (lang) {
  // 09/10: un capitolo tradotto col dizionario si ricarica nella nuova lingua (molte parti della lezione si
  // costruiscono una volta sola: ridipingerle a metà lascerebbe due lingue insieme). Si torna alla sezione
  // salvata; il concetto in corso riparte dal suo inizio.
  if (L10N_SLOTS.length && L10N_LANG0 && lang !== L10N_LANG0) { try { persistProgress(); } catch (e) {} location.reload(); return; }
  LANG = lang;
  l10nRelang();
  if (!DOC) return;
  // ⚠️ È `applyLang()` a invocare questo hook, e lo fa PRIMA di ridipingere i [data-i18n]:
  // richiamare applyLang() qui dentro ricorre all'infinito (misurato: stack overflow), e fare il
  // lavoro subito non serve perché il repaint successivo cancellerebbe la rinumerazione degli
  // step. Si rimanda quindi al giro dopo.
  setTimeout(function () {
    // L'Intro si ricostruisce per intero: porta stringhe con numeri dentro (i chip) che un
    // `data-i18n` non può risolvere, e non contiene stato dell'utente, quindi rifarla è sicuro.
    buildIntroPage(); mountIntroPreview(); if (curSect === 'intro') scaleIntroPreview();
    renderSteps(); paintSectionTitles(); buildTutorQuestions(); paintPanel(); renderNotes();
    // video vero: si ricostruisce (file e testo nella nuova lingua, se c'è), dal punto in cui era
    // (solo se cambia davvero la lingua del video: rifarla a ogni giro staccava il pannello dal motore)
    if (SECTS.indexOf('video') >= 0 && lsVideoData() && lsVideoLang() !== lsVidBuiltLang) {
      var ve = document.getElementById('va-video'), at = ve ? ve.currentTime : 0;
      buildRealVideoPage(); if (at) lsVideoSeek(at);
      if (curSect === 'video' && window.awVaSyncHeight) window.awVaSyncHeight();
    }
    if (sectionComplete('quiz') && document.getElementById('cc-unlocked').style.display === 'block') populateCompletionCard();
  }, 0);
};

  var order = ok ? st.slice() : (function () { var a = []; for (var k = 0; k < n; k++) a.push(k); a.push(a.shift()); return a; })();

}

var p26Drag = null;

document.addEventListener('dragover', function (e) { var r = e.target.closest && e.target.closest('.p26-ro'); if (!r || p26Drag === null) return; e.preventDefault(); document.querySelectorAll('.p26-ro.over').forEach(function (x) { x.classList.remove('over'); }); r.classList.add('over'); });

function p26Say(text) { if (!text) return; P26.chat.queue.push(text); if (!P26.chat.typing) p26Flush(); }

  var C = P26.chat; if (!C.queue.length) { C.typing = false; p26Render(); return; }

    else { p26Say(LT(DOC.sections.practice.scenario.closing)); var wait = setInterval(function () { if (!C.typing && !C.queue.length) { clearInterval(wait); scnDoneFlag = true; refreshGates(); p26Render(); } }, 120); }

// ═══ QUIZ 2026 (10/10, COPIONE_CAP3 §4, dal prototipo di Giulia) ══════════════════════════════════
// Una domanda per volta su una carta, risposte A-D in colonna: si sceglie, poi "Check answer". Dopo il
// controllo: la giusta verde ("Correct"), la scelta sbagliata ambra ("Your answer"), sotto "Right." /
// "Not quite." + spiegazione + la riga "In TilliT:". Esito sul palco al posto della domanda. Come la
// Practice, la pagina vecchia resta nascosta e tiene i suoi flag (qIdx, qScore, #quiz-result, che dice
// a sectionComplete se il quiz è superato): qui si usano nextQ/showResult/retryQuiz di sempre.
var Q26 = { sel: null, checked: false, res: [], fin: false };
function q26Correct(q) { var c = -1; (q.options || []).forEach(function (o, i) { if (o.correct) c = i; }); return c; }
function q26Fin() { return Q26.fin || (sectionComplete('quiz') && !Q26.res.length); }
function q26Card() {
  var n = QUESTIONS.length;
  if (q26Fin()) {
    var pass = sectionComplete('quiz');
    return '<div class="p26-card q26-res' + (pass ? ' ok' : ' no') + '"><span class="q26-big">' + i26(pass ? 'check' : 'restart') + '</span>'
      + '<span class="q26-eb">' + escapeHtml(t26(pass ? 'qPassed' : 'qNotYet')) + '</span>'
      + '<h2>' + escapeHtml(t26('correct', { n: qScore, m: n })) + '</h2>'
      + '<p>' + escapeHtml(pass ? t26('qPassTxt') : t26('qFailTxt', { p: PASS_THRESHOLD })) + '</p>'
      + '<div class="q26-acts"><button type="button" class="q26-btn2" onclick="q26Retry()">' + i26('restart') + escapeHtml(t26('retry')) + '</button>'
      + (!pass && SECTS.indexOf('concepts') >= 0 ? '<button type="button" class="p26-btn" onclick="gs(\'concepts\')">' + escapeHtml(t26('reviewC')) + '</button>' : '') + '</div></div>';
  }
  var q = QUESTIONS[qIdx]; if (!q) return '';
  var ci = q26Correct(q), ok = Q26.checked && Q26.sel === ci;
  var opts = (q.options || []).map(function (o, i) {
    var c = '', tag = '';
    if (Q26.checked) {
      if (i === ci) { c = ' right'; tag = '<span class="tag">' + escapeHtml(t26('qCorrect')) + '</span>'; }
      else if (i === Q26.sel) { c = ' miss'; tag = '<span class="tag">' + escapeHtml(t26('yourAns')) + '</span>'; }
    }
    return '<button type="button" class="q26-o' + c + '" onclick="q26Pick(' + i + ')"' + (Q26.checked ? ' disabled' : ' aria-pressed="' + (Q26.sel === i) + '"') + '>'
      + '<span class="l">' + 'ABCD'.charAt(i) + '</span><span class="tx">' + escapeHtml(LT(o.text)) + '</span>' + tag + '</button>';
  }).join('');

    + (vis ? '<div class="q26-in"><b>' + escapeHtml(tf('ls.quiz.vis', { p: productName() })) + '</b> ' + escapeHtml(vis) + '</div>' : '') + '</div></div>' : '';

document.addEventListener('keydown', function (e) {

// ═══ DONE 2026 (10/10, COPIONE_CAP3 §5, dal prototipo di Giulia) ══════════════════════════════════
// Riquadro navy di fine capitolo (è anche il certificato: sigillo + "Print certificate"), tre numeri,
// carta "Coming next". Colonna: i capitoli del training con lo stato vero e "Your manager sees it".
// Il certificato vecchio resta costruito e nascosto: è lui che si stampa (@media print).
function d26Chapters() {
  // I capitoli veri del training (stato dell'editor/catalogo) e, per i PKX, il piano su carta dove mancano.
  var co = ls26Course(), out = [];
  var pkx = /^PKX-/i.test(String(LESSON_ID)) && co.list.length < PKX_PLAN_CHAPTERS;
  if (pkx) PKX_TRAINING.chapters.forEach(function (c, i) {
    var real = co.list.filter(function (l) { var m = /^PKX-(\d+)/i.exec(l.id); return m && parseInt(m[1], 10) === i + 1; })[0];
    out.push({ n: i + 1, t: awDictT(real ? LT(real.title) || c.t : c.t), id: real && real.id, soon: !real, teaser: awDictT(c.teaser), min: c.min });
  });
  else co.list.forEach(function (l, i) { out.push({ n: i + 1, t: LT(l.title) || l.id, id: l.id, soon: false }); });
  var prog = {}; try { prog = JSON.parse(localStorage.getItem('aw_progress') || '{}'); } catch (e) {}
  out.forEach(function (c) {
    c.cur = !!c.id && String(c.id).toUpperCase() === String(LESSON_ID).toUpperCase();
    c.done = c.cur ? (sectionComplete('quiz') || SECTS.indexOf('quiz') < 0) : !!(c.id && prog[c.id]);
  });
  return out;
}
// Il capitolo dopo questo (nella lista del training) e il suo link, solo se è proprio quello e pubblicato.

function d26SumShot(c) {
  var lib = (DOC.mockupLibrary || {})[c.simulatorId], m = c.simulatorId ? MOCKS[mockKey(c.simulatorId)] : null;
  if (!lib || !m) return null;
  var clone = document.createElement('div');
  clone.className = String(m.el.className || '').split(/\s+/).filter(function (k) { return /^ls-mock/.test(k); }).join(' ');
  clone.innerHTML = m.html || '';
  try {   // le azioni lavorano solo dentro la radice che ricevono: qui il clone, ancora fuori dal documento
    var acts = window.gcMakeActions(lib.actions || {}, clone);
    (c.startActions || []).forEach(function (sa) { window.gcRunAction(acts, sa.id, sa.arg, null, clone); });
  } catch (e) { console.warn('[sum]', e); }
  clone.querySelectorAll('[id]').forEach(function (e) { e.removeAttribute('id'); });
  clone.querySelectorAll('[data-zone],[data-ls-item],[data-gc-item]').forEach(function (e) {
    e.removeAttribute('data-zone'); e.removeAttribute('data-ls-item'); e.removeAttribute('data-gc-item');
  });
  return clone;
}

function d26Summary() {

  var box = document.createElement('div'); box.id = 'ls-sum'; box.setAttribute('aria-hidden', 'true');
  box.innerHTML = d26SumHtml(); document.body.appendChild(box);
  // le schermate: rese a 1280px (larghezza da desktop), poi scalate alla larghezza del foglio
  var cs = DOC.sections.concepts || [];
  box.querySelectorAll('[data-sum-shot]').forEach(function (fig) {
    var shot = d26SumShot(cs[+fig.getAttribute('data-sum-shot')]);
    if (!shot) { fig.parentNode.removeChild(fig); return; }
    var fit = fig.firstChild, inn = fit.firstChild; inn.appendChild(shot);
    // Si scala sulla larghezza vera del contenuto: il Cockpit sfora i 1280px, la Station View ne usa meno e
    // lascerebbe una fascia bianca a destra. Larghezza = il bordo destro più lontano tra gli elementi visibili.
    var w = Math.max(inn.offsetWidth, inn.scrollWidth, shot.scrollWidth);
    inn.style.width = w + 'px';
    var x0 = inn.getBoundingClientRect().left, right = 0;
    shot.querySelectorAll('*').forEach(function (e) {
      // scrollWidth conta anche il testo che sborda dal suo riquadro (es. "Pack Expo Chicago" in testata)
      var r = e.getBoundingClientRect(); if (!r.width || !r.height) return;
      var rr = Math.max(r.right, r.left + e.scrollWidth) - x0; if (rr > right) right = rr;
    });
    if (right > 200 && right < w) w = Math.ceil(right);
    var k = fit.clientWidth / w; inn.style.transform = 'scale(' + k + ')';
    fit.style.height = Math.ceil(inn.scrollHeight * k) + 'px';
  });
