<title data-i18n="title.index">Training Platform · autoware</title>
<style>
/* ── HOME — dashboard a 2 colonne (main + sidebar), ispirata a layout reali ── */
.h-wrap{position:relative;padding:14px 22px;display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:18px;max-width:1600px;margin:0 auto;width:100%;align-items:start}
/* trattamento di sfondo — glow morbido dietro l'hero, derivato dai token brand (mai un nuovo colore) */
.h-wrap::before{content:'';position:absolute;top:-18px;left:-22px;right:-22px;height:420px;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 780px 380px at 14% 0%, rgba(15,39,87,.06), transparent 62%),
    radial-gradient(ellipse 620px 320px at 92% 4%, rgba(224,49,138,.05), transparent 58%);}
[data-theme="dark"] .h-wrap::before{
  background:
    radial-gradient(ellipse 780px 380px at 14% 0%, rgba(69,101,173,.10), transparent 62%),
    radial-gradient(ellipse 620px 320px at 92% 4%, rgba(224,49,138,.07), transparent 58%);}
.h-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.h-side{display:flex;flex-direction:column;gap:12px;min-width:0}
/* ── MY TRAINING — copertine corso (Operator/Superuser). Layout ORIZZONTALE (cover a sinistra + testo a
   destra): riempie la riga in larghezza senza allungare la card in altezza — la sezione deve stare nel
   viewport senza costringere a scrollare la pagina. */
.hd-crs-row{display:flex;gap:14px;flex-wrap:wrap}
.lib-card{flex:1 1 300px;max-width:380px;display:flex;flex-direction:row;align-items:stretch;border:.5px solid var(--border2);border-left:4px solid var(--aw-navy);border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:var(--e3);cursor:pointer;text-decoration:none;transition:box-shadow .16s,transform .16s}
.lib-card:hover{box-shadow:var(--e4);transform:translateY(-2px)}
.lib-card[data-track="tillit-su"]{border-left-color:#E91E8C}
.lib-cover{position:relative;width:104px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#F5F6F8;overflow:hidden}
.lib-card[data-track="tillit-su"] .lib-cover{background:#FDF2F8}
.lib-role{position:absolute;top:7px;left:7px;display:inline-flex;align-items:center;gap:3px;padding:3px 7px 3px 5px;border-radius:20px;font-size:8.5px;font-weight:700;letter-spacing:.01em;background:var(--aw-navy);color:#fff;line-height:1}
.lib-role svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lib-role[data-role="tillit-su"]{background:#E91E8C}
.lib-cover-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lib-body{display:flex;flex-direction:column;justify-content:center;padding:12px 15px;flex:1;min-width:0}
.lib-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-meta{font-size:10.5px;color:var(--text2);margin-bottom:9px;line-height:1.3}
.lib-bar{height:4px;border-radius:2px;background:var(--bg2);overflow:hidden}
.lib-bar-fill{height:100%;border-radius:2px;background:#E91E8C;transition:width .4s}
.lib-prog-lbl{font-size:10.5px;font-weight:500;color:#E91E8C;margin-top:6px;font-family:var(--font-mono)}
@media(max-width:520px){.lib-card{flex-basis:100%}}
/* ── CONTINUE CARD — il capitolo in corso, sezione "Resume". Composta da 3 riquadri distinti (intestazione /
   progresso+stepper / azioni) separati da divisori netti + un pannello con ombra propria per lo stepper (il
   cuore informativo): niente più righe di testo buttate lì senza gerarchia. ── */
.hd-cur-card{padding:0;border-radius:14px;background:linear-gradient(135deg,rgba(224,49,138,.07),rgba(224,49,138,.02));border:1px solid rgba(224,49,138,.22);box-shadow:var(--e2);overflow:hidden}
.hd-cur-head{padding:14px 18px 12px;border-bottom:1px solid rgba(224,49,138,.16)}
/* riga intestazione a 3 blocchi: badge+testo a sinistra, CTA "Inizia/Riprendi" al centro, thumbnail a destra
   (justify-content:space-between li distribuisce lungo tutta la riga). Il CTA vive qui — non più in un footer
   separato — cosi la card resta corta quando non ci sono capitoli da espandere (nessuna sezione extra). */
.hd-cur-top{display:flex;align-items:center;gap:20px}
/* flex:1 = il blocco testo/CTA cresce a riempire la riga, cosi la thumbnail resta ancorata subito dopo
   (con un solo gap fisso) invece di lasciare una banda vuota generata dal precedente space-between */
.hd-cur-top-l{display:flex;align-items:center;gap:16px;min-width:0;flex:1}
.hd-cur-badge{width:44px;height:44px;border-radius:12px;background:var(--aw-pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;font-family:var(--font-mono);box-shadow:0 6px 14px rgba(224,49,138,.35)}
.hd-cur-info{min-width:0}
.hd-cur-eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--aw-pink);margin-bottom:4px}
.hd-cur-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-cur-title b{color:var(--aw-pink);font-weight:800;font-size:12px;letter-spacing:.04em;margin-right:8px;font-family:var(--font-mono)}
/* meta (capitoli/durata) come chip distinti affiancati — distribuiti in orizzontale invece di un'unica
   riga di testo con un punto come separatore, ora che la riga ha più spazio a disposizione */
.hd-cur-meta{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hd-cur-meta .mchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text2);background:var(--bg2);padding:5px 11px;border-radius:20px;white-space:nowrap}
.hd-cur-meta svg{width:12px;height:12px;opacity:.75}
/* pannello progresso+stepper — riquadro a sé (sfondo diverso dal resto della card + ombra interna, non un
   margine fluttuante ingombrante): è il cuore informativo della card, deve leggersi come tale a colpo d'occhio,
   restando comunque compatto */
/* tono pink-tinted coerente con il gradiente della card (non il --bg2 neutro usato per i "pozzetti" altrove):
   il pannello legge come una sezione incassata della STESSA superficie, non un blocco scollegato sotto */
.hd-cur-panel{padding:12px 18px;background:rgba(224,49,138,.045);box-shadow:inset 0 1px 4px rgba(15,39,87,.06);border-bottom:1px solid rgba(224,49,138,.14)}
/* riga dato quantitativo: "N% · X di 6 sezioni" — il progresso del capitolo in corso vive QUI (non più nella Welcome) */
.hd-cur-prog{font-size:12.5px;font-weight:700;color:var(--aw-pink)}
/* stepper 6 tappe — stato REALE per-sezione del capitolo in corso: nodi più grandi + una vera barra di
   connessione fatta/da-fare, non solo un separatore tipografico */
.hd-cur-steps{display:flex;align-items:flex-start;gap:0;margin-top:10px}
.hd-cur-step{display:inline-flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--text3);white-space:nowrap;text-align:center}
.hd-cur-step .n{width:26px;height:26px;border-radius:50%;background:var(--bg2);color:var(--text3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono);border:2px solid var(--bg2);transition:background .2s,border-color .2s}
.hd-cur-step .n svg{width:12px;height:12px}
.hd-cur-step.done{color:var(--text2)}
.hd-cur-step.done .n{background:var(--teal);color:#fff;border-color:var(--teal)}
.hd-cur-step.cur{color:var(--text);font-weight:700}
.hd-cur-step.cur .n{background:var(--bg);color:var(--aw-pink);border-color:var(--aw-pink);box-shadow:0 0 0 3px rgba(224,49,138,.15)}
/* margin-top:12px = metà del nodo (26px) meno metà della linea (2px): allinea la connessione al centro dei cerchi,
   non al centro dell'intero step (che include anche l'etichetta sotto) */
.hd-cur-step-sep{flex:1;height:2px;min-width:10px;background:var(--bg2);margin:12px -1px 0;border-radius:1px;align-self:flex-start}
.hd-cur-step-sep.done{background:var(--teal)}
/* segmento che entra nello step corrente: dissolve da teal (fatto) a fucsia (in corso) invece del
   passaggio netto teal->grigio, cosi il percorso "fatto" si lega visivamente allo step attivo */
.hd-cur-step-sep.tocur{background:linear-gradient(to right, var(--teal), var(--aw-pink))}
/* usata solo quando ci sono capitoli espandibili (foot con la sola lista sotto la riga di intestazione) */
.hd-cur-foot{padding:12px 18px 14px}
.hd-cur-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hd-cur-cta{background:var(--aw-pink);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:700;font-family:var(--font);display:inline-flex;align-items:center;gap:7px;cursor:pointer;text-decoration:none;box-shadow:0 6px 14px rgba(224,49,138,.3);transition:background .15s,transform .15s}
.hd-cur-cta:hover{background:#c9106d;transform:translateY(-1px)}
.hd-cur-cta svg{width:14px;height:14px}
/* pillola con etichetta (non solo icona): la funzione "espandi/comprimi capitoli" deve leggersi da sola, non competere in ambiguità col CTA Riprendi */
.hd-cur-chaptoggle{height:32px;border-radius:9px;border:.5px solid rgba(224,49,138,.25);background:var(--bg);display:inline-flex;align-items:center;gap:6px;color:var(--aw-pink);cursor:pointer;padding:0 12px;flex-shrink:0;font-size:12px;font-weight:600;font-family:var(--font);transition:background .12s,transform .2s}
.hd-cur-chaptoggle:hover{background:rgba(224,49,138,.08)}
.hd-cur-chaptoggle svg{width:14px;height:14px;transition:transform .2s;flex-shrink:0}
.hd-cur-card.open .hd-cur-chaptoggle svg{transform:rotate(180deg)}
.hd-cur-subs{display:none;margin-top:12px;padding-top:12px;border-top:.5px solid rgba(224,49,138,.16)}
.hd-cur-card.open .hd-cur-subs{display:block}

/* card base — ombre marcate per dare profondità al contenuto */
.hd-card{background:var(--bg);border:.5px solid var(--border);border-radius:16px;box-shadow:var(--e2)}
.hd-sec-hd{display:flex;align-items:center;gap:14px;margin-bottom:0}
/* il TESTO è protagonista; l'icona resta un accento discreto */
.hd-sec-t{font-size:25px;font-weight:800;color:var(--text);letter-spacing:-.6px;line-height:1.05;display:inline-flex;align-items:center;gap:10px}
.hd-sec-icwrap{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--aw-pink)}
.hd-sec-ic{width:23px;height:23px;color:var(--aw-pink);flex-shrink:0;opacity:.9}
.hd-viewall{font-size:12px;color:var(--text3);text-decoration:none;font-weight:500;margin-left:auto;flex-shrink:0}
.hd-viewall:hover{color:var(--aw-pink)}

/* ── CAPITOLI (dentro la card Continue learning) ── */
.hd-msub{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:8px;position:relative;text-decoration:none;transition:background .12s}
a.hd-msub:hover{background:var(--bg)}
.hd-msub-node{width:22px;height:22px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--bg3);color:var(--text3);border:.5px solid var(--border)}
.hd-msub-node svg{width:11px;height:11px}
.hd-msub.done .hd-msub-node{background:var(--teal-l);color:var(--teal-d);border-color:transparent}
.hd-msub.cur .hd-msub-node{background:var(--aw-pink);color:#fff;border-color:transparent}
.hd-msub-id{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.03em;min-width:30px;flex-shrink:0;font-family:var(--font-mono)}
.hd-msub-name{font-size:12.5px;color:var(--text);font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.hd-msub:hover .hd-msub-name{color:var(--aw-pink)}
.hd-msub-go{width:14px;height:14px;color:var(--text3);flex-shrink:0;opacity:0;transition:opacity .12s}
a.hd-msub:hover .hd-msub-go{opacity:1}

/* ── WELCOME (compatto) ── */
.hd-welcome{position:relative;background:var(--aw-hero-grad);border-radius:18px;box-shadow:var(--e4);overflow:hidden;display:flex;align-items:center;padding:34px 26px;min-height:132px}
/* frecce di brand Autoware (Picture1.png, pink=azione/azzurro=dati, da analisi autoware.it) come
   texture decorativa laterale. Il testo riempie quasi tutta la card sotto ~1250px di viewport (il
   testo non si accorcia, è la card a restringersi con la sidebar) → sotto quella soglia non c'è
   spazio laterale libero e la grafica resta spenta; sopra, mask-image la dissolve verso il testo. */
.hd-welcome-arrows{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
@media(min-width:1250px){
  .hd-welcome-arrows{
    -webkit-mask-image:linear-gradient(to left,#000 45%,transparent 82%);
    mask-image:linear-gradient(to left,#000 45%,transparent 82%)}
  .hd-welcome-arrows::before{content:'';position:absolute;top:-14%;right:-6%;width:60%;height:86%;
    background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
  .hd-welcome-arrows::after{content:'';position:absolute;inset:0;
    background-image:url('Picture1.png');background-repeat:no-repeat;
    background-size:32% auto;background-position:right -7px top -123px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.35)) brightness(1.12) saturate(1.05);opacity:.85}
}
.hd-welcome-l{flex:1;min-width:0;z-index:1}
.hd-eyebrow{font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.45);text-transform:uppercase;font-weight:600;margin-bottom:8px}
.hd-welcome-h{font-size:22px;font-weight:600;color:#fff;letter-spacing:-.3px;line-height:1.25;min-width:0}
/* volto allineato ALLA RIGA del saluto (non all'intero blocco eyebrow+saluto): avatar e "Good afternoon…" si
   leggono come un'unica voce invece di sembrare due elementi scollegati */
.hd-welcome-top{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.hd-welcome-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* tagline di piattaforma/brand — sostituisce il vecchio riferimento al modulo specifico (spostato nella card Resume) */
.hd-welcome-sub{font-size:12.5px;color:rgba(255,255,255,.62);margin:6px 0 12px;max-width:440px}
/* pillola streak / ultimo accesso — solo se c'è un segnale reale (aw_activity_log), mai un numero finto */
.hd-welcome-streak{position:absolute;z-index:1;top:18px;right:22px;display:none;align-items:center;gap:6px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:5px 12px 5px 9px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.82);white-space:nowrap}
.hd-welcome-streak svg{width:13px;height:13px;color:var(--aw-pink);flex-shrink:0}
@media(max-width:640px){.hd-welcome{flex-wrap:wrap}.hd-welcome-streak{position:static;order:3;margin-top:10px}}
/* thumbnail del capitolo in corso: riusa (scalata) l'illustrazione .iv-dev gia mostrata nell'Intro del modulo.
   Decorativa, non cliccabile: l'unica azione della card resta il CTA Riprendi qui sotto.
   Box dimensionato sul contenuto PIU alto (login, 418px naturali) cosi nessuna variante viene tagliata; le
   varianti piu basse (cockpit/station view) lasciano solo un margine navy in piu sotto, mai un ritaglio. */
.hd-cur-thumb{position:relative;width:180px;height:150px;border-radius:11px;overflow:hidden;flex-shrink:0;box-shadow:var(--e2);background:var(--aw-navy)}
.hd-cur-thumb-scale{width:520px;transform-origin:top left}
.hd-cur-thumb-scale .iv-dev{border-radius:0}
/* ── STATION VIEW (subset .sv-*) — non e nel CSS condiviso (vive solo inline in OP-03.html): copia minima
   dei soli selettori usati dalla thumbnail qui sopra, altrimenti il preview del modulo 03 e privo di stile. ── */
.sv{background:#f4f5f7;border:1px solid #d5d9e0;border-radius:10px;overflow:hidden;font-family:-apple-system,'Inter',sans-serif;text-align:left;box-shadow:0 1px 3px rgba(15,39,87,.08)}
.sv-top{background:#fff;border-bottom:1px solid #eceef2;padding:7px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:38px}
.sv-date{display:flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;white-space:nowrap}
.sv-date svg{width:13px;height:13px;color:#9ca3af;flex-shrink:0}
.sv-date-lbl{font-size:7px;color:#2f6bd8;line-height:1.1;font-weight:600}
.sv-date-val{font-size:10px;color:#374151;font-weight:700;line-height:1.2}
.sv-arrows{display:flex;gap:3px}
.sv-arr{width:22px;height:22px;border:1px solid #e5e7eb;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b7280}
.sv-pin{width:26px;height:26px;border-radius:50%;background:#eef0f3;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sv-pin svg{width:14px;height:14px;color:#6b7280}
.sv-seg{position:relative;display:inline-flex}
.sv-seg-btn{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.sv-seg-btn .sub{font-size:8px;opacity:.9;font-weight:500}
.sv-seg-btn.green{background:#22c55e}
.sv-seg-badge{position:absolute;right:-6px;bottom:-6px;min-width:16px;height:16px;padding:0 3px;border-radius:9px;background:#eab308;color:rgba(0,0,0,.78);font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.sv-stage{background:#f59e0b;color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:5px}
.sv-body{display:grid;gap:10px;padding:10px;background:#f4f5f7}
.sv-col{overflow:hidden}
.sv-po{display:flex;flex-direction:column;gap:9px;min-width:0}
.sv-work{display:flex;flex-direction:column;min-width:0}
.sv-card{background:#fff;border:1px solid #edeff2;border-radius:9px;box-shadow:0 1px 2px rgba(15,39,87,.05)}
.sv-oc{padding:10px 12px}
.sv-oc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.sv-oc-title{font-size:12.5px;font-weight:700;color:#111827}
.sv-oc-code{font-size:9px;color:#6b7280;line-height:1.45;margin-bottom:8px;word-break:break-word}
.sv-mrow{display:flex;align-items:center;gap:6px;font-size:10px;color:#374151;margin-bottom:5px}
.sv-mrow svg{width:13px;height:13px;color:#9ca3af;flex-shrink:0}
.sv-mrow .run{margin-left:auto;display:flex;align-items:center;gap:4px;color:#16a34a;font-weight:700}
.sv-mrow .run svg{width:14px;height:14px;color:#16a34a}
.sv-prog-bar{height:8px;background:#eef0f3;border-radius:5px;position:relative;margin:7px 0 5px}
.sv-prog-fill{height:100%;background:#16a34a;border-radius:5px}
.sv-tabs{display:flex;align-items:center;border-bottom:1px solid #eceef2;background:#fff;padding:0 2px;border-radius:9px 9px 0 0}
.sv-tab{padding:9px 12px;font-size:12px;color:#9ca3af;border-bottom:2px solid transparent;font-weight:500}
.sv-tab.active{color:#2563eb;border-color:#2563eb;font-weight:700}
.sv-list{overflow-y:auto;flex:1;background:#f4f5f7;padding:2px 0 6px}
.sv-pri-banner{background:#ef4444;color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em;text-align:center;padding:8px;text-transform:uppercase;margin:8px 8px 4px;border-radius:6px}
.sv-ac{background:#fff;border:1px solid #edeff2;border-radius:9px;margin:8px;padding:11px 12px}
.sv-ac-title{font-size:12.5px;font-weight:700;color:#111827;margin-bottom:3px}

/* ── ASSIGNED TRAINING CARDS ── */
.hd-trainings{display:flex;flex-direction:column;gap:10px}
.hd-tcard{background:var(--bg);border:.5px solid var(--border);border-radius:11px;box-shadow:var(--e2);padding:11px 14px;display:flex;flex-direction:row;align-items:center;gap:12px;text-decoration:none;transition:box-shadow .15s,transform .15s;border-left:3px solid var(--aw-pink)}
.hd-tcard:hover{box-shadow:var(--e3);transform:translateY(-1px)}
.hd-tcard-top{display:none}

.hd-prog{display:flex;align-items:center;gap:8px}
.hd-prog-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}

<script>
// ── Dati prototipo ──────────────────────────────────────────────────────
var progress;
try { progress = JSON.parse(localStorage.getItem('aw_progress') || '{}'); if (typeof progress !== 'object' || Array.isArray(progress)) throw 0; }
catch (e) { progress = {}; }

var TOTAL_PATH = window.AW_EDITION_TRAINING ? (window.AW_MODULES || []).length : ((window.AW_MODULES || []).length || 7);
var SECTIONS_PER_MODULE = 6;
var MINUTES_PER_MODULE = 10;
// progresso REALE per-modulo dalle sezioni completate (localStorage['aw_sect'])
var SECT_PROG = (function(){ try{ return JSON.parse(localStorage.getItem('aw_sect')||'{}'); }catch(e){ return {}; } })();
// unica fonte di verità per il progresso di un modulo: le stesse 6 sezioni del flusso didattico
// (Intro→Completion) contano sia per la percentuale sia per i check dello stepper — mai due
// denominatori diversi (prima la % ignorava Intro/Completion mentre lo stepper li contava, dando
// numeri contraddittori come "0% · 1 di 6 sezioni fatte")
// 14/10: le sezioni vere del capitolo (awSectKeys, shared.js); nel laboratorio restano le 6 dei moduli OP.
function moduleProgress(id){
  var K = awSectKeys(id);
  if(progress[id]===true) return { idx: K.length, pct: 100 };
  var done = (SECT_PROG[id] && SECT_PROG[id].done) || [];
  var idx = 0;
  for (var i = 0; i < K.length; i++) { if (done.indexOf(K[i]) === -1) break; idx = i + 1; }
  return { idx: idx, pct: idx > 0 ? Math.min(99, Math.round(idx / K.length * 100)) : 0 };
}
function stepKeysH(id){ return awSectKeys(id).map(function (k) { return 'tab.' + (k === 'anchor' ? 'completion' : k); }); }

// Ogni modulo si compone di 6 SEZIONI (flusso didattico: Intro/Video/Concepts/Practice/Quiz/Completion)
// e di N CAPITOLI di contenuto (sotto-capitoli). Capitoli e durata vengono letti direttamente da
// window.AW_MODULES (shared.js) — stessa fonte usata da modules.html — invece di due mappe locali
// duplicate che potevano (e sono finite per) divergere (es. OP-06 mostrava 2 capitoli qui e 4 in
// modules.html, e le durate stimate dei moduli 04-07 non coincidevano affatto).
var HOME_MODS = (window.AW_MODULES || []).map(function (m) {
  return { id: m.id, code: (window.awChapNo ? awChapNo(m) : m.num), label: (window.awChapLabel ? awChapLabel(m) : m.num), title: m.title, href: m.href, chaps: m.subs || [m.title], mins: m.mins || MINUTES_PER_MODULE };
});

var SKILL_MAP = { '01': ['Login', 'Language'], '02': ['Cockpit', 'Station View'], '03': ['Production Orders'] };

  // stepper a 6 tappe — stato REALE (fatto/in corso/da fare) del capitolo in corso, letto da moduleProgress()

  function renderSteps(modId) {

      + '</div></a>';
  }
  document.getElementById('pt-lib-sub').textContent = COURSES.length + ' ' + (COURSES.length === 1 ? t('home.lib.one', 'training') : t('home.lib.many', 'trainings'));
  // pillole di riepilogo nell'intestazione: in corso / da iniziare / completati (solo quelle con almeno 1)
  var pcts = COURSES.map(function (c) { return c.total ? Math.round(c.frac / c.total * 100) : 0; });
  document.getElementById('pt-lib-pills').innerHTML = [
      ['cur', t('lib.filter.progress', 'In progress'), pcts.filter(function (p) { return p > 0 && p < 100; }).length],
      ['todo', t('dash.sl.notstarted', 'Not started'), pcts.filter(function (p) { return p === 0; }).length],
      ['done', t('sidebar.completed', 'Completed'), pcts.filter(function (p) { return p >= 100; }).length]
    ].filter(function (p) { return p[2] > 0; }).map(function (p) { return '<span class="pt-pill ' + p[0] + '"><i></i>' + p[2] + ' ' + p[1] + '</span>'; }).join('');
  document.getElementById('hd-courses-row').innerHTML = COURSES.map(renderCourseCard).join('')
    // 1 solo training: riquadro "ne arriveranno altri" (prototipo, caso 1)
    + (COURSES.length === 1 ? '<div class="pt-more"><span>+</span><b>' + t('home.lib.more', 'More training will appear here') + '</b><small>' + t('home.lib.moresub', 'When your supervisor assigns a new course') + '</small></div>' : '');

  // ── AGENDA (impegni di training) ──
  renderAgenda(curMod, evts);

  // ── GLOSSARY TERM OF THE DAY ──
  renderTermOfDay();

  // ── SKILLS (donut = mix competenze/moduli) — nessun fallback finto: con 0 moduli completati sono 0
  // competenze acquisite, punto, coerente col resto della pagina (Welcome/Riprendi/libreria a 0%) ──
  var skills = [];
  doneIds.forEach(function (m) { (SKILL_MAP[m.id] || []).forEach(function (s) { if (skills.indexOf(s) === -1) skills.push(s); }); });
  var skillsTot = ALL_SKILLS.length;
  var skillsAcq = skills.length;
  var skPct = skillsTot ? Math.round(skillsAcq / skillsTot * 100) : 0;
  // anello animato al caricamento: parte da 0 e transita al valore reale (rispetta prefers-reduced-motion via CSS)
  // ── YOUR PROGRESS (prototipo): anello = avanzamento del percorso, moduli + competenze, poi la prossima
  // competenza (cerchio tratteggiato) e le ultime acquisite (spunta verde). Stessi dati di prima. ──
  var pathPct = TOTAL_PATH ? Math.round(opFrac / TOTAL_PATH * 100) : 0;
  var locked = ALL_SKILLS.filter(function (s) { return skills.indexOf(s) === -1; });
  var C = 2 * Math.PI * 36;
  var progHTML = '<div class="pt-prog-top"><div class="pt-ring"><svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="36" class="trk"/>'
    + '<circle cx="44" cy="44" r="36" class="val" stroke-dasharray="' + (C * pathPct / 100).toFixed(2) + ' 300" transform="rotate(-90 44 44)"/></svg><span>' + pathPct + '%</span></div>'
    + '<div><b>' + doneCount + '/' + TOTAL_PATH + ' ' + t('home.skills.modules', 'modules completed') + '</b><div class="pt-sub">' + skillsAcq + '/' + skillsTot + ' ' + t('home.skills.acquired', 'competencies') + '</div></div></div>';
  if (locked.length) progHTML += '<div class="pt-skill"><span class="pt-dot next"></span><div><b>' + skillLabel(locked[0]) + '</b><div class="pt-sub">' + t('mods.rail.upnext', 'Up next') + '</div></div></div>';
  skills.slice(-2).reverse().forEach(function (s) {
    progHTML += '<div class="pt-skill"><span class="pt-dot ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span><div><b>' + skillLabel(s) + '</b><div class="pt-sub">' + t('sidebar.completed', 'Completed') + '</div></div></div>';
  });
  document.getElementById('pt-prog-bd').innerHTML = progHTML;
}

// Agenda training: impegni reali dell'operatore (mock; in produzione = backend/manager).
// agendaEvents = solo il calcolo (usato anche dalla card Continue per la scadenza); renderAgenda = il disegno.
function agendaEvents(curMod) {
  function nd(n) { var d = new Date(); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d; }

  // Impegni assegnati dal manager (dashboard.html → localStorage). Filtra su
  // "tutto il team" o sull'utente corrente. Se gli store sono vuoti, usa il
  // seed mock qui sotto così la home non parte vuota per la demo.
  function parseISO(iso) { var p = (iso || '').split('-'); return new Date(+p[0], (+p[1] || 1) - 1, (+p[2] || 1)); }
  var me = (window.AW_USER && AW_USER.name) || 'Learner';
  var myTrainings = ['op'];
  try { var _u = (window.awLoadUsers ? awLoadUsers() : []).filter(function (x) { return x.name === me; })[0]; if (_u) myTrainings = window.awUserTrainings(_u); } catch (e) {}
  function forMe(target) { return window.awAssignMatch(target, me, myTrainings); }
  var mSessions = [], mAssigns = [];
  try { mSessions = (window.awLoadSessions ? awLoadSessions() : []).filter(function (s) { return forMe(s.invitees); }); } catch (e) {}
  // Only assignments with a due date surface on the (date-driven) agenda.
  try { mAssigns = (window.awLoadAssignments ? awLoadAssignments() : []).filter(function (a) { return a.dueDate && forMe(a.target); }); } catch (e) {}

  var events;
  if (mSessions.length || mAssigns.length) {
    events = [];
    mSessions.forEach(function (s) {
      events.push({ type: 'session', date: parseISO(s.date),
        label: s.title || t('home.ev.session'), time: awFmtTime(s.time), host: awWho(s.host) || '',
        detail: awFmtTime(s.time) + (s.host ? ' \xB7 ' + awWho(s.host) : ''),
        href: s.teamsUrl || '#', action: s.teamsUrl ? null : 'remind' });
    });
    mAssigns.forEach(function (a) {
      var isCourse = a.level === 'course' || a.kind === 'path';
      if (isCourse) {
        events.push({ type: 'deadline', date: parseISO(a.dueDate),
          label: t('home.ev.duepath'), detail: courseLabel(myTrainings), href: 'modules.html' });
      } else {
        var mods = a.moduleIds || (a.moduleId ? [a.moduleId] : []);
        mods.forEach(function (mid) {
          if ((/^SU/.test(mid) ? myTrainings.indexOf('su') : myTrainings.indexOf('op')) < 0) return;
          var m = HOME_MODS.filter(function (x) { return x.id === mid; })[0] || curMod;
          if (!m) return;
          events.push({ type: 'deadline', date: parseISO(a.dueDate), mod: m.id,
            label: t('home.ev.duemod').replace('{code}', m.label || m.code),
            detail: tmod(m), href: m.href || 'modules.html' });
        });
      }
    });
  } else if (window.AW_CONTENT) {
    events = [];   // 14/10: nell'edizione niente esempi inventati — assegnazione e sessione vere da awApplyEdition
  } else {
    events = [
      { type: 'session',  date: nd(2),  label: t('home.ev.session'), time: SESSION_TIME, host: SESSION_HOST,
        detail: SESSION_TIME + ' \xB7 ' + SESSION_HOST, href: '#', action: 'remind' },
      { type: 'deadline', date: nd(12), label: t('home.ev.duepath'),
        detail: courseLabel(myTrainings), href: 'modules.html' }
    ];
    if (curMod) events.splice(1, 0, { type: 'deadline', date: nd(5), mod: curMod.id, label: t('home.ev.duemod').replace('{code}', curMod.label || curMod.code),
        detail: tmod(curMod), href: curMod.href || 'modules.html' });
  }
  events.sort(function (a, b) { return a.date - b.date; });
  return events;
}

// Colonna destra (prototipo): TODAY = la prossima sessione live, DEADLINES = le scadenze (max 3) con il
// riquadro data. Una sezione senza impegni non viene mostrata.
function renderAgenda(curMod, events) {
  events = events || agendaEvents(curMod);
  var now = new Date(); now.setHours(0, 0, 0, 0);
  var sess = events.filter(function (e) { return e.type === 'session'; })[0];
  var dls = events.filter(function (e) { return e.type === 'deadline'; }).slice(0, 3);
  var up = function (s) { return String(s).toUpperCase(); };

  document.getElementById('pt-today').style.display = sess ? '' : 'none';
  if (sess) {
    var btn = sess.action === 'remind'
      ? '<button class="pt-btn pt-btn-wide" onclick="this.disabled=true;this.textContent=\'' + t('home.ag.reminded') + '\'">' + t('home.sess.remind') + '</button>'
      : (sess.href && sess.href !== '#' ? '<a class="pt-btn pt-btn-wide" href="' + sess.href + '">' + t('home.badge.live', 'Live') + '</a>' : '');
    document.getElementById('pt-today-bd').innerHTML = '<div class="pt-ev"><span class="pt-ev-k">' + up(t('home.badge.live', 'Live')) + ' \xB7 '
      + up(ptDate(sess.date, { weekday: 'short', day: 'numeric', month: 'short' })) + (sess.time ? ' \xB7 ' + sess.time : '') + '</span>'
      + '<span class="pt-ev-t">' + sess.label + '</span>' + (sess.host ? '<span class="pt-sub">' + sess.host + '</span>' : '') + '</div>' + btn;
  }

  document.getElementById('pt-dead').style.display = dls.length ? '' : 'none';
  document.getElementById('pt-dead-bd').innerHTML = dls.map(function (e) {
    var soon = Math.round((e.date - now) / 86400000) <= 7;
    var inner = '<div class="pt-day"><span>' + up(ptDate(e.date, { weekday: 'short' })) + '</span><b class="' + (soon ? 'soon' : '') + '">' + e.date.getDate() + '</b></div>'
      + '<div class="pt-dl"><b>' + e.label + '</b><div class="pt-sub">' + (e.detail || '') + '</div></div>';
    return e.href && e.href !== '#' ? '<a class="pt-dlrow" href="' + e.href + '">' + inner + '</a>' : '<div class="pt-dlrow">' + inner + '</div>';
  }).join('');
}

// termine glossario del giorno — rotazione deterministica sul giorno dell'anno, riusa GLOSSARY/GLOSSARY_NAMES
// + nota urgente (My Notes): la più importante ancora aperta (priorità alta, altrimenti la più recente);
// la freccia nell'intestazione alterna i due pannelli. Senza note resta solo il termine.
var PT_IC_TERM = '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>';
var PT_IC_NOTE = '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7"/><path d="M9 16h5"/></svg>';
function renderTermOfDay() {
  var card = document.getElementById('hd-term-card');
  if (!card) return;
  var art = card.querySelector('.pt-art'); if (art) art.innerHTML = PT_ARROWS;
  var notes = []; try { notes = (window.awLoadNotes ? awLoadNotes() : []).filter(function (n) { return n && n.text && n.status !== 'resolved' && n.status !== 'closed'; }); } catch (e) {}
  var note = notes.filter(function (n) { return n.priority === 'high'; })[0] || notes[0] || null;
  var hasTerm = typeof GLOSSARY !== 'undefined' && GLOSSARY.length;
  if (!hasTerm && !note) { card.style.display = 'none'; return; }
  var paneT = document.getElementById('pt-term-term'), paneN = document.getElementById('pt-term-note'), btn = document.getElementById('pt-term-next');
  function show(which) {
    var isNote = which === 'note';
    paneT.hidden = isNote; paneN.hidden = !isNote;
    document.getElementById('pt-term-ic').innerHTML = isNote ? PT_IC_NOTE : PT_IC_TERM;
    document.getElementById('pt-term-title').textContent = isNote
      ? (note.priority === 'high' ? t('home.note.urgent', 'Urgent note') : t('home.note.latest', 'Latest note'))
      : t('home.term.eyebrow', 'Term of the day');
    card.classList.toggle('is-note', isNote);
    btn.setAttribute('aria-label', isNote ? t('home.term.eyebrow', 'Term of the day') : t('home.note.urgent', 'Urgent note'));
  }
  if (note) {
    var catKey = ({ Appunto: 'note', Domanda: 'question', Problema: 'issue' })[note.category] || 'note';   // categoria interna IT → chiave i18n
    document.getElementById('pt-note-cat').textContent = t('note.cat.' + catKey, note.category || '');
    document.getElementById('pt-note-text').textContent = note.text;
    document.getElementById('pt-note-meta').textContent = [note.module, note.time].filter(Boolean).join(' \xB7 ');
    document.getElementById('pt-note-go').textContent = t('home.note.open', 'Open My Notes');
  }
  btn.hidden = !(note && hasTerm);
  btn.onclick = function () { show(paneN.hidden ? 'note' : 'term'); };
  show(hasTerm ? 'term' : 'note');
  if (!hasTerm) return;
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var doy = Math.floor((now - start) / 86400000);
  var entry = GLOSSARY[doy % GLOSSARY.length];
  var lang = window.LANG || 'en';
  var tr = (typeof GLOSSARY_NAMES !== 'undefined' && GLOSSARY_NAMES[entry.term] && lang !== 'en') ? GLOSSARY_NAMES[entry.term][lang] : null;
  document.getElementById('hd-term-name').textContent = entry.term;
  var trEl = document.getElementById('hd-term-tr');
  if (tr && tr !== entry.term) { trEl.textContent = tr; trEl.style.display = ''; } else { trEl.style.display = 'none'; }
  document.getElementById('hd-term-desc').textContent = entry[lang] || entry.en;
  paneT.href = 'glossary.html?q=' + encodeURIComponent(entry.term);
}

// cambio lingua → ricompone tutte le stringhe (placeholder, date localizzate)
window._onLangChange = function (lang) { renderHome(); };

// ── Init ────────────────────────────────────────────────────────────────
var LANG = localStorage.getItem('aw_lang') || 'en';
window.LANG = LANG;
renderChrome('home');
renderHome();
applyLang(LANG);
</script>
